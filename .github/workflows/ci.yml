name: Validate TCM Workbench
on:
  push:
    branches: [main, "improve/**"]
  pull_request:
    branches: [main]
permissions:
  contents: write
# Only the newest run for a given ref matters. Older runs are cancelled instead of
# racing the publish step against a main that has already moved on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild all generated course and library artifacts
        run: npm run build:all
      - name: Verify generated HTML matches course source data
        run: npm run check:generated
      - name: Validate course data and embedded engine
        run: npm run validate
      - name: Run JavaScript tests
        run: npm test
      - name: Run publisher safety tests
        run: npm run test:python
      - name: Publish generated static artifacts on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            # Publish on top of the current remote tip. A commit that landed while
            # this run was building would otherwise make `git push` a non-fast-forward.
            git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main
            git reset --hard origin/main

            # Rebuild against the newest sources so the artifacts match the tree
            # they are committed to, not the tree this run originally checked out.
            npm run build:all

            git add -- index.html build/domains.json library/index.json library/白话/
            if git diff --cached --quiet; then
              echo "Generated artifacts are already up to date."
              exit 0
            fi

            git commit -m "build(v2.2): refresh generated learning workbench"
            if git push origin HEAD:main; then
              echo "Published generated artifacts (attempt ${attempt})."
              exit 0
            fi

            echo "::warning::Push rejected on attempt ${attempt}; main moved, retrying on the newer tip."
            sleep 5
          done

          echo "::error::Could not publish generated artifacts after 5 attempts."
          exit 1
