name: Validate TCM Workbench
on:
  push:
    branches: [main, "improve/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild all generated course and library artifacts
        run: npm run build:all
      - name: Verify generated HTML matches course source data
        run: npm run check:generated
      - name: Validate course data and embedded engine
        run: npm run validate
      - name: Run JavaScript tests
        run: npm test
      - name: Run publisher safety tests
        run: npm run test:python
