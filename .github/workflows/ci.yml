name: Validate TCM Workbench
on:
  push:
    branches: [main, "improve/**"]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild all generated course and library artifacts
        run: npm run build:all
      - name: Verify generated HTML matches course source data
        run: npm run check:generated
      - name: Validate course data and embedded engine
        run: npm run validate
      - name: Run JavaScript tests
        run: npm test
      - name: Run publisher safety tests
        run: npm run test:python
      - name: Publish generated static artifacts on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html build/domains.json library/index.json library/白话/
          if git diff --cached --quiet; then
            echo "Generated artifacts are already up to date."
          else
            git commit -m "build(v2.2): refresh generated learning workbench"
            git push
          fi
