<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中医学习工作台</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#A6433A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="学中医">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="六阶段中医学习路径、公版古籍资料库、可导出的学习卡片与提问模板。">
<style>
:root{
  --paper:#F7F5F0; --card:#FFFFFF; --ink:#2E2B26; --ink2:#6B655B; --ink3:#989184;
  --line:#E5E0D6; --red:#A6433A; --red-bg:#FBF0ED; --green:#4A6B57; --green-bg:#EDF4EF;
  --amber:#8A6A2F; --amber-bg:#FAF4E6; --blue:#3F6480; --blue-bg:#EDF3F7;
  --serif:"Songti SC","STSong","Noto Serif CJK SC",serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px calc(80px + env(safe-area-inset-bottom))}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font-family:inherit;font-size:14px}
button{cursor:pointer}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding-bottom:20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hero h1{font-size:30px;margin:0 0 6px;letter-spacing:2px}
.hero .sub{color:var(--ink2);margin:0;font-size:13px}
.hero-meta{display:flex;gap:26px;text-align:right}
.hero-meta .kv b{display:block;font-size:24px;font-family:var(--serif);color:var(--red);line-height:1.2}
.hero-meta .kv span{font-size:12px;color:var(--ink3)}
.tabs{display:flex;gap:2px;margin:22px 0 26px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 17px;color:var(--ink2);white-space:nowrap;font-size:14px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--red);border-bottom-color:var(--red);font-weight:600}
.panel{display:none}.panel.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.card h3{margin:0 0 4px;font-size:17px}
.card .muted{color:var(--ink2);font-size:13px}
.sec-title{font-size:19px;margin:0 0 4px}
.sec-desc{color:var(--ink2);font-size:13px;margin:0 0 18px}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;line-height:1.7;border:1px solid transparent}
.b-red{background:var(--red-bg);color:var(--red);border-color:#EED8D2}
.b-green{background:var(--green-bg);color:var(--green);border-color:#D6E5DA}
.b-amber{background:var(--amber-bg);color:var(--amber);border-color:#EDE1C6}
.b-blue{background:var(--blue-bg);color:var(--blue);border-color:#D7E3EC}
.b-gray{background:#F3F1EC;color:var(--ink2);border-color:var(--line)}
.bar{height:8px;background:#EDE9E0;border-radius:8px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .3s}
.todo{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.todo:last-child{border-bottom:0}
.todo input{width:17px;height:17px;accent-color:var(--green);flex:none}
.todo.done span{color:var(--ink3);text-decoration:line-through}
.quote{font-family:var(--serif);font-size:19px;line-height:2;letter-spacing:1px;margin:6px 0 12px}
.quote-src{color:var(--ink2);font-size:13px}
.think{background:var(--amber-bg);border-left:3px solid #D9B96A;padding:12px 14px;border-radius:0 6px 6px 0;margin-top:14px;font-size:13px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.stage-head{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;user-select:none}
.stage-num{width:34px;height:34px;flex:none;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:16px;color:var(--red)}
.stage.finished .stage-num{background:var(--green-bg);color:var(--green);border-color:#D6E5DA}
.stage-head h3{margin:0;font-size:17px;flex:1}
.stage-body{display:none;padding:0 20px 20px 68px;border-top:1px solid var(--line)}
.stage.open .stage-body{display:block}
.stage-body h4{margin:16px 0 6px;font-size:13px;color:var(--ink2);font-weight:600;letter-spacing:1px}
.stage-body ul{margin:0;padding-left:18px}
.stage-body li{margin:3px 0}
.quiz{background:var(--paper);border-radius:8px;padding:12px 14px;margin-top:8px}
.quiz p{margin:4px 0;font-size:13px}
.chip{display:inline-block;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:3px 9px;margin:3px 5px 3px 0;font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters input,.filters select{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:8px 11px;outline:none}
.filters input:focus,.filters select:focus{border-color:var(--red)}
.fbtn{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;color:var(--ink2);font-size:13px}
.fbtn.on{background:var(--red);color:#fff;border-color:var(--red)}
.res-card{display:flex;flex-direction:column;gap:6px}
.res-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.res-top b{font-size:15px;font-family:var(--serif)}
.res-star{color:var(--red);font-size:13px;white-space:nowrap}
.res-note{color:var(--ink2);font-size:13px;flex:1}
.res-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink3);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--ink2);font-weight:600;background:var(--paper);white-space:nowrap}
td code{background:var(--paper);padding:1px 5px;border-radius:4px;font-size:12px}
pre{background:#2E2B26;color:#F1EDE4;padding:14px 16px;border-radius:8px;overflow-x:auto;font-size:12.5px;line-height:1.8;margin:10px 0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:7px 13px;color:var(--ink);font-size:13px}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
.btn.primary:hover{opacity:.9;color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.form-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.form-row input,.form-row select,.form-row textarea{border:1px solid var(--line);border-radius:7px;padding:9px 11px;background:var(--card);outline:none}
.form-row input:focus,.form-row textarea:focus{border-color:var(--red)}
.form-row .f1{flex:1;min-width:150px}
.form-row textarea{width:100%;min-height:88px;resize:vertical}
.card-item{border:1px solid var(--line);border-radius:9px;padding:15px 17px;background:var(--card);margin-bottom:10px}
.card-item h4{margin:0 0 6px;font-size:15px;font-family:var(--serif)}
.card-item .body{white-space:pre-wrap;font-size:13.5px;margin:6px 0}
.card-item .src{color:var(--ink3);font-size:12px}
.card-item .ops{float:right;display:flex;gap:6px}
.prompt{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--card);margin-bottom:9px}
.prompt p{margin:0 0 8px;font-size:13.5px;white-space:pre-wrap}
.note{background:var(--red-bg);border:1px solid #EED8D2;border-radius:8px;padding:13px 16px;font-size:13px;color:#7E3A32;margin:14px 0}
.ok{background:var(--green-bg);border:1px solid #D6E5DA;border-radius:8px;padding:13px 16px;font-size:13px;color:#35503F;margin:14px 0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0}
.step{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px}
.step b{display:block;font-family:var(--serif);font-size:15px;margin-bottom:5px}
.step span{font-size:12.5px;color:var(--ink2)}
.foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink3);font-size:12px;line-height:1.9}
.empty{color:var(--ink3);text-align:center;padding:34px 10px;font-size:13px}
@media(max-width:600px){.wrap{padding:18px 14px 60px}.stage-body{padding-left:20px}.hero-meta{text-align:left}.grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

<div class="hero">
  <div>
    <h1>中医学习工作台</h1>
    <p class="sub">从教材到经典，从条文到医案 —— 一条能积累、能回溯、能自测的学习路径</p>
  </div>
  <div class="hero-meta">
    <div class="kv"><b id="m-progress">0%</b><span>路径完成度</span></div>
    <div class="kv"><b id="m-streak">0</b><span>连续打卡（天）</span></div>
    <div class="kv"><b id="m-cards">0</b><span>学习卡片</span></div>

</div>

<nav class="tabs" id="tabs">

  <button class="tab" data-p="cards">我的卡片</button>
  <button class="tab" data-p="sync">笔记库</button>

</nav>

<section class="panel active" id="p-overview"></section>

<section class="panel" id="p-sync"></section>

<div class="foot">
  数据仅保存在本机浏览器 localStorage，不上传任何服务器；清理浏览器数据会丢失，请定期用「我的卡片 → 导出备份」。<br>
  本工作台及所引开源项目仅用于中医学习与古籍研读，不构成诊断、处方、用药或剂量建议；身体不适请就诊于执业中医师。<br>
  资源与 star 数核对于 2026-11-13，仓库状态会变化。
</div>
</div>

function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object')return Object.assign({done:{},checks:{},cards:[],deleted:{},streak:0,lastCheck:'',readIdx:0},s)}catch(e){}return {done:{},checks:{},cards:[],deleted:{},streak:0,lastCheck:'',readIdx:0}}
let state=load();
function save(skipSync){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('本地存储写入失败，建议导出备份')}if(!skipSync)markDirty()}

const SYNC_KEY='tcm-sync-v1';
let syncCfg=(function(){try{return JSON.parse(localStorage.getItem(SYNC_KEY))||null}catch(e){return null}})();
let syncMeta={status:'idle',msg:'',at:'',sha:null,busy:false,timer:null};
function nowStr(){const d=new Date();return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function setSync(patch){syncMeta=Object.assign(syncMeta,patch);renderSyncMeta()}
function syncStatusHtml(){
  const map={idle:['b-gray','未启用'],ok:['b-green','已同步'],busy:['b-blue','同步中'],dirty:['b-amber','待同步'],error:['b-red','同步失败']};
  const it=map[syncMeta.status]||map.idle;
  return '<span class="badge '+it[0]+'">'+it[1]+'</span>'+(syncMeta.at?' <span class="muted" style="font-size:12px">'+esc(syncMeta.at)+'</span>':'')+(syncMeta.msg?' <span class="muted" style="font-size:12px">'+esc(syncMeta.msg)+'</span>':'');
}
function renderSyncMeta(){const el=document.getElementById('syncstatus');if(el)el.innerHTML=syncStatusHtml();const b=document.getElementById('syncbadge');if(b)b.innerHTML=syncStatusHtml()}
async function ghApi(method,path,body){
  const r=await fetch('https://api.github.com'+path,{method:method,headers:{'Authorization':'Bearer '+syncCfg.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const data=await r.json().catch(()=>({}));
  if(r.status===404)return {ok:false,status:404,data:data};
  if(!r.ok)throw new Error((data&&data.message)||('HTTP '+r.status));
  return {ok:true,data:data};
}
function mergeStates(local,remote){
  const out=Object.assign({},remote);
  out.deleted=Object.assign({},remote.deleted||{},local.deleted||{});
  const map=new Map();
  (remote.cards||[]).forEach(c=>map.set(c.id,c));
  (local.cards||[]).forEach(c=>{
    const r=map.get(c.id);
    if(!r||(c.updatedAt||c.created||'')>=(r.updatedAt||r.created||''))map.set(c.id,c);
  });
  out.cards=Array.from(map.values()).filter(c=>{
    const t=out.deleted[c.id];
    return !t||(c.updatedAt||0)>t;
  });
  out.done=Object.assign({},remote.done||{});
  Object.keys(local.done||{}).forEach(k=>{if(local.done[k])out.done[k]=true});
  out.checks=Object.assign({},remote.checks||{});
  Object.keys(local.checks||{}).forEach(k=>{
    const a=out.checks[k]||[false,false,false],b=local.checks[k]||[];
    out.checks[k]=[0,1,2].map(i=>!!(a[i]||b[i]));
  });
  out.streak=Math.max(remote.streak||0,local.streak||0);
  out.lastCheck=[remote.lastCheck||'',local.lastCheck||''].sort().pop();
  out.readIdx=(local.readIdx||0);
  return out;
}
async function syncPull(silent){
  if(!syncCfg)return;
  setSync({status:'busy',msg:'读取云端…'});
  try{
    const res=await ghApi('GET','/repos/'+syncCfg.owner+'/'+syncCfg.repo+'/contents/'+syncCfg.path);
    if(!res.ok){setSync({status:'ok',msg:'云端尚无数据，首次保存时创建',at:nowStr(),sha:null});return}
    const raw=res.data.content.replace(/\s/g,'');
    const remote=JSON.parse(new TextDecoder().decode(b64ToBin(raw)));
    const before=state.cards.length;
    state=mergeStates(state,remote);
    save(true);
    setSync({status:'ok',msg:'已合并云端数据（本地 '+before+' → '+state.cards.length+' 张）',at:nowStr(),sha:res.data.sha});
    renderAll();
  }catch(e){setSync({status:'error',msg:'拉取失败：'+e.message})}
}
async function syncPush(){
  if(!syncCfg||syncMeta.busy)return;
  syncMeta.timer=null;syncMeta.busy=true;setSync({status:'busy',msg:'写入云端…'});
  try{
    const body={message:'notes: '+new Date().toLocaleString('zh-CN'),content:binToB64(new TextEncoder().encode(JSON.stringify(state)))};
    if(syncMeta.sha)body.sha=syncMeta.sha;
    let res=await ghApi('PUT','/repos/'+syncCfg.owner+'/'+syncCfg.repo+'/contents/'+syncCfg.path,body);
    if(!res.ok)throw new Error('路径不存在或无权限（HTTP 404）');
    syncMeta.sha=res.data.content.sha;
    setSync({status:'ok',msg:'已提交 '+state.cards.length+' 张卡片',at:nowStr()});
  }catch(e){
    const msg=String(e.message||e);
    if(/409|sha|conflict/i.test(msg)){
      try{
        const g=await ghApi('GET','/repos/'+syncCfg.owner+'/'+syncCfg.repo+'/contents/'+syncCfg.path);
        if(g.ok){
          state=mergeStates(state,JSON.parse(new TextDecoder().decode(b64ToBin(g.data.content.replace(/\s/g,'')))));
          save(true);syncMeta.sha=g.data.sha;
          const body={message:'notes: merge '+new Date().toLocaleString('zh-CN'),content:binToB64(new TextEncoder().encode(JSON.stringify(state))),sha:syncMeta.sha};
          const r2=await ghApi('PUT','/repos/'+syncCfg.owner+'/'+syncCfg.repo+'/contents/'+syncCfg.path,body);
          if(r2.ok){syncMeta.sha=r2.data.content.sha;setSync({status:'ok',msg:'冲突已合并',at:nowStr()});syncMeta.busy=false;return}
        }
      }catch(e2){}
    }
    setSync({status:'error',msg:'写入失败：'+msg});
  }
  syncMeta.busy=false;
}
function markDirty(){

}

function binToB64(u8){let s='';const CH=0x8000;for(let i=0;i<u8.length;i+=CH){s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH))}return btoa(s)}
function b64ToBin(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
async function makeSyncCode(){
  const bytes=new TextEncoder().encode(JSON.stringify(state));
  if(typeof CompressionStream!=='undefined'){
    try{
      const gz=await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).blob();
      return 'TCM2:'+binToB64(new Uint8Array(await gz.arrayBuffer()));
    }catch(e){}
  }
  return 'TCM1:'+binToB64(bytes);
}
async function readSyncCode(code){
  code=(code||'').trim();
  if(code.startsWith('TCM2:')){
    const u=b64ToBin(code.slice(5));
    const txt=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return JSON.parse(txt);
  }
  if(code.startsWith('TCM1:')){return JSON.parse(new TextDecoder().decode(b64ToBin(code.slice(5))))}
  throw new Error('这不是本工作台生成的同步码');
}

    <textarea id="synccode" placeholder="同步码会显示在这里；也可以把另一台设备生成的码粘进来，再点「从同步码导入」" style="width:100%;min-height:70px;border:1px solid var(--line);border-radius:7px;padding:9px;font-family:ui-monospace,monospace;font-size:12px;resize:vertical"></textarea>
  </div>
  <div class="filters">
    <input id="cardq" placeholder="搜索卡片" value="${esc(window._cardQuery||'')}" style="min-width:220px">
    ${['全部'].concat(CARD_TYPES).map(t=>`<button class="fbtn ${f===t?'on':''}" data-cardfilter="${esc(t)}">${esc(t)}</button>`).join('')}
    <span style="margin-left:auto;display:flex;gap:6px">
      <button class="btn sm" data-act="export">导出备份</button>
      <button class="btn sm" data-act="import">导入</button>
      <input type="file" id="importfile" accept=".json" style="display:none">
    </span>
  </div>
  <div id="cardlist">${list.length?list.map(c=>`
    <div class="card-item">
      <div class="ops"><button class="btn sm" data-edit="${c.id}">编辑</button><button class="btn sm" data-del="${c.id}">删除</button></div>
      <h4><span class="badge b-blue">${esc(c.type)}</span> ${esc(c.title)}</h4>
      <div class="body">${esc(c.body)}</div>
      <div class="src">出处：${esc(c.source||'未标注')} ${(c.tags||[]).length?' · 标签：'+c.tags.map(t=>'<span class="chip">'+esc(t)+'</span>').join(''):''} · ${esc(c.created)}</div>
    </div>`).join(''):'<div class="empty">还没有卡片。从今天的一条原文开始，写第一张吧。</div>'}</div>`;
}

function renderSync(){
  const r=syncCfg?syncCfg.owner+'/'+syncCfg.repo:'zhshy/tcm-notes';
  const p=syncCfg?syncCfg.path:'state.json';
  document.getElementById('p-sync').innerHTML=`
  <h3 class="sec-title">笔记库 · 长期沉淀</h3>
  <p class="sec-desc">把数据存进你自己的 GitHub 私有仓库，用 Git 做版本历史。换设备、换浏览器、三年后回头看，笔记都还在，而且随时能整库迁走。</p>

  <div class="card" style="margin-bottom:16px">
    <h3>连接状态 <span id="syncstatus">${syncStatusHtml()}</span></h3>
    <p class="muted" style="margin:6px 0 12px">${syncCfg?'当前写入 <b>'+esc(r)+'</b> 的 <code>'+esc(p)+'</code>':'尚未连接。启用后，卡片与打卡进度会自动提交到私有仓库；不启用也能正常用，只是数据仅在本机。'}</p>
    <div class="form-row">
      <button class="btn" data-act="pullnow" ${syncCfg?'':'disabled'}>立即拉取</button>
      <button class="btn" data-act="pushnow" ${syncCfg?'':'disabled'}>立即提交</button>
      <button class="btn" data-act="exportmd">导出为 Markdown</button>
      ${syncCfg?'<button class="btn" data-act="clearsync">断开连接</button>':''}
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <h3>配置</h3>
    <div class="form-row">
      <input id="sync-repo" class="f1" value="${esc(r)}" placeholder="owner/repo" style="min-width:220px">
      <input id="sync-path" class="f1" value="${esc(p)}" placeholder="state.json" style="min-width:150px">
    </div>
    <div class="form-row">
      <input id="sync-token" class="f1" type="password" placeholder="${syncCfg?'已保存令牌，留空表示不修改':'粘贴 fine-grained token（仅该仓库 Contents 读写）'}" style="min-width:320px">
      <button class="btn primary" data-act="savecfg">保存并连接</button>
    </div>
    <p class="muted" style="font-size:12px;margin:4px 0 0">令牌只写入本机 localStorage，只发往 api.github.com，不经过任何第三方。公用电脑请勿保存。</p>
  </div>

  <div class="grid-2">
    <div class="card">
      <h3>为什么不放在站点仓库里</h3>
      <p class="muted">GitHub Pages 站点仓库是公开的，笔记若放进去等于公开日记。所以数据单独走一个<b>私有仓库</b>：站点公开、笔记私有，两条线分开。</p>
      <p class="muted">写入方式是 GitHub Contents API，每次保存生成一个 commit。三年下来就是一部可回溯的笔记史——哪张卡哪天改的，都查得到。</p>
    </div>
    <div class="card">
      <h3>令牌怎么建（建议 fine-grained）</h3>
      <p class="muted" style="margin:0 0 8px">GitHub → Settings → Developer settings → <b>Personal access tokens → Fine-grained tokens</b> → Generate new token：</p>
      <ul class="muted" style="margin:0;padding-left:18px;font-size:13px">
        <li>Repository access：Only select repositories → 勾 <code>tcm-notes</code></li>
        <li>Permissions → Repository permissions → <b>Contents: Read and write</b></li>
        <li>过期时间按需设，到期换一个即可，不影响数据</li>
      </ul>
      <p class="muted" style="margin:8px 0 0;font-size:12px">这样即使令牌泄露，也只能动这一个笔记仓库，碰不到你的代码。</p>
    </div>
  </div>

  <div class="ok" style="margin-top:16px"><b>数据归你：</b>state.json 是纯文本，Git 历史完整保留每一次修改。想搬走时，克隆仓库即可；想换成别的工具，用「导出为 Markdown」得到一份按卡片类型分组的可读笔记。</div>`;
}

function exportMarkdown(){
  if(!state.cards.length){alert('还没有卡片');return}
  const by={};state.cards.forEach(c=>{(by[c.type]=by[c.type]||[]).push(c)});
  let md='# 中医学习笔记\n\n导出时间：'+today()+'　共 '+state.cards.length+' 张卡片\n\n';
  CARD_TYPES.forEach(t=>{
    if(!by[t])return;
    md+='## '+t+'\n\n';
    by[t].forEach(c=>{
      md+='### '+c.title+'\n\n'+c.body+'\n\n';
      if(c.source)md+='- 出处：'+c.source+'\n';
      if((c.tags||[]).length)md+='- 标签：'+c.tags.join('、')+'\n';
      md+='- 建立：'+(c.created||'')+'　更新：'+(c.updatedAt||'').slice(0,10)+'\n\n';
    });
  });
  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='中医学习笔记-'+today()+'.md';a.click();
  URL.revokeObjectURL(a.href);toast('已导出 Markdown');
}

function renderPrompts(){
  document.getElementById('p-prompts').innerHTML=`
  <h3 class="sec-title">提问模板</h3>
  <p class="sec-desc">同一份语料，问法不同，学到的东西差一个量级。这些模板的共同点是：<b>要求出处、暴露推导、把结论留给自己</b>。点「复制」直接粘进对话。</p>
  ${PROMPTS.map(g=>`<div class="card" style="margin-bottom:14px"><h3>${esc(g.c)}</h3>${g.list.map(p=>`
    <div class="prompt"><p>${esc(p.p)}</p><button class="btn sm" data-copy="${esc(p.p)}">复制</button> <span class="muted" style="font-size:12px">${esc(p.t)}</span></div>`).join('')}</div>`).join('')}`;
}

function renderAll(){renderOverview();renderPath();renderResources();renderLibrary();renderSkills();renderCards();renderSync();renderPrompts()}

document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));
  document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id==='p-'+b.dataset.p));
});

document.addEventListener('input',e=>{
  if(e.target.id==='resq'){resQuery=e.target.value;renderResources();const el=document.getElementById('resq');el.focus();el.setSelectionRange(el.value.length,el.value.length)}
  if(e.target.id==='cardq'){window._cardQuery=e.target.value;const pos=e.target.selectionStart;renderCards();const el=document.getElementById('cardq');el.focus();el.setSelectionRange(pos,pos)}
  if(e.target.id==='libq'){libQuery=e.target.value;const pos=e.target.selectionStart;renderLibrary();const el=document.getElementById('libq');el.focus();el.setSelectionRange(pos,pos)}
});

document.addEventListener('click',e=>{
  const t=e.target;
  const cat=t.dataset.cat;if(cat){resFilter=cat;renderResources();return}
  const cf=t.dataset.cardfilter;if(cf){window._cardFilter=cf;renderCards();return}
  const lc=t.dataset.libcat;if(lc){libFilter=lc;renderLibrary();return}
  const cp=t.hasAttribute('data-copy');if(cp){copyText(t.getAttribute('data-copy'));return}
  const fin=t.dataset.finish;
  if(fin){state.done[fin]=!state.done[fin];save();renderPath();renderOverview();return}
  const tog=t.closest('[data-toggle]');
  if(tog){const s=tog.parentElement;s.classList.toggle('open');return}
  const todo=t.dataset.todo;
  if(todo!==undefined){
    const d=today();const arr=state.checks[d]||[false,false,false];arr[+todo]=t.checked;state.checks[d]=arr;
    if(arr.every(Boolean)&&state.lastCheck!==d){state.streak=(state.lastCheck===yesterday()?state.streak:0)+1;state.lastCheck=d}
    save();renderOverview();return;
  }
  const del=t.dataset.del;
  if(del){if(confirm('删除这张卡片？')){state.deleted=state.deleted||{};state.deleted[del]=Date.now();state.cards=state.cards.filter(c=>c.id!==del);save();renderCards();renderOverview()}return}
  const ed=t.dataset.edit;
  if(ed){const c=state.cards.find(x=>x.id===ed);if(!c)return;
    window._editingId=ed;
    document.getElementById('c-type').value=c.type;document.getElementById('c-title').value=c.title;
    document.getElementById('c-source').value=c.source||'';document.getElementById('c-body').value=c.body;
    document.getElementById('c-tags').value=(c.tags||[]).join(',');
    document.getElementById('c-title').focus();toast('编辑中，改完点保存');return}
  const act=t.dataset.act;
  if(!act)return;
  if(act==='nextread'){state.readIdx=(state.readIdx+1)%READINGS.length;save();renderOverview()}
  if(act==='copyread'){const r=READINGS[state.readIdx%READINGS.length];copyText(r.q+'  ——'+r.s)}
  if(act==='gopath'){document.querySelector('[data-p="path"]').click()}
  if(act==='goskills'){document.querySelector('[data-p="skills"]').click()}
  if(act==='tocard'){const r=READINGS[state.readIdx%READINGS.length];document.querySelector('[data-p="cards"]').click();
    document.getElementById('c-title').value=r.s+'：我的理解';document.getElementById('c-source').value=r.s;
    document.getElementById('c-body').value='先写下自己的解释，再回原书核对。\n想一想：'+r.t;document.getElementById('c-title').focus()}
  if(act==='copycontract'){copyText(PROMPTS[PROMPTS.length-1].list[0].p)}
  if(act==='copyinstall'){copyText('BASE="$HOME/.workbuddy/skills"\nSRC="/Users/iptv/WorkBuddy/2026-11-13-13-44-58/tcm-workbench/skills"\nmkdir -p "$BASE"\nrsync -a "$SRC/中医/" "$BASE/中医/"\nrsync -a "$SRC/nihaisha/" "$BASE/nihaisha/"\nrsync -a "$SRC/ye-tianshi/" "$BASE/ye-tianshi/"')}
  if(act==='addcard'){
    const title=document.getElementById('c-title').value.trim();
    const body=document.getElementById('c-body').value.trim();
    if(!title||!body){alert('标题和正文都要写');return}
    const payload={type:document.getElementById('c-type').value,title:title,body:body,
      source:document.getElementById('c-source').value.trim(),
      tags:document.getElementById('c-tags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),
      updatedAt:new Date().toISOString()};
    if(window._editingId){
      const c=state.cards.find(x=>x.id===window._editingId);
      if(c)Object.assign(c,payload);
      window._editingId=null;
      toast('已更新');
    }else{
      state.cards.push(Object.assign({id:'c'+Date.now()+Math.random().toString(36).slice(2,6),created:today()},payload));
      toast('卡片已保存');
    }
    save();renderCards();renderOverview()}
  if(act==='export'){
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='中医学习工作台-备份-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('已导出')}
  if(act==='import'){document.getElementById('importfile').click()}
  if(act==='savecfg'){
    const repoV=document.getElementById('sync-repo').value.trim();
    const pathV=document.getElementById('sync-path').value.trim()||'state.json';
    const tokV=document.getElementById('sync-token').value.trim();
    const parts=repoV.split('/');
    if(parts.length!==2||!parts[0]||!parts[1]){alert('仓库格式应为 owner/repo，例如 zhshy/tcm-notes');return}
    const token=tokV||(syncCfg&&syncCfg.token)||'';
    if(!token){alert('请填写令牌');return}
    syncCfg={owner:parts[0],repo:parts[1],path:pathV,token:token};
    try{localStorage.setItem(SYNC_KEY,JSON.stringify(syncCfg))}catch(e){}
    syncMeta.sha=null;renderSync();syncPull();
  }
  if(act==='pullnow'){syncPull()}
  if(act==='pushnow'){syncPush()}
  if(act==='exportmd'){exportMarkdown()}
  if(act==='clearsync'){
    if(confirm('断开后本机数据保留，但不再自动同步。确定？')){
      syncCfg=null;try{localStorage.removeItem(SYNC_KEY)}catch(e){}
      syncMeta={status:'idle',msg:'',at:'',sha:null,busy:false,timer:null};renderSync();
    }
  }
  if(act==='gencode'){
    makeSyncCode().then(c=>{const el=document.getElementById('synccode');if(el){el.value=c;el.focus();el.select()}copyText(c)}).catch(()=>alert('生成失败，请改用「导出备份」'))}
  if(act==='usecode'){
    const el=document.getElementById('synccode');const code=el?el.value:'';
    readSyncCode(code).then(o=>{
      if(!o||!Array.isArray(o.cards))throw new Error('内容不完整');
      if(!confirm('导入会覆盖本机现有卡片与进度，确定继续？'))return;
      state=Object.assign({done:{},checks:{},cards:[],streak:0,lastCheck:'',readIdx:0},o);
      save();renderAll();toast('已导入 '+state.cards.length+' 张卡片');
    }).catch(err=>alert('导入失败：'+(err&&err.message?err.message:'无法解析')));
  }
});

document.addEventListener('change',e=>{
  if(e.target.id==='importfile'&&e.target.files[0]){
    const f=e.target.files[0];const rd=new FileReader();
    rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o.cards)throw 0;
      state=Object.assign({done:{},checks:{},cards:[],streak:0,lastCheck:'',readIdx:0},o);
      save();renderAll();toast('导入成功')}catch(err){alert('文件格式不对，请选择本工作台导出的 JSON')}};
    rd.readAsText(f)}
});

renderAll();
if(syncCfg){setTimeout(()=>syncPull(),900)}
</script>
