<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中医学习工作台</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<meta name="theme-color" content="#A6433A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="学中医">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="六阶段中医学习路径、公版古籍资料库、可导出的学习卡片与提问模板。">
<style>
:root{
  --paper:#F7F5F0; --card:#FFFFFF; --ink:#2E2B26; --ink2:#6B655B; --ink3:#989184;
  --line:#E5E0D6; --red:#A6433A; --red-bg:#FBF0ED; --green:#4A6B57; --green-bg:#EDF4EF;
  --amber:#8A6A2F; --amber-bg:#FAF4E6; --blue:#3F6480; --blue-bg:#EDF3F7;
  --serif:"Songti SC","STSong","Noto Serif CJK SC",serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding:28px 24px calc(80px + env(safe-area-inset-bottom))}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:600}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font-family:inherit;font-size:14px}
button{cursor:pointer}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding-bottom:20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hero h1{font-size:30px;margin:0 0 6px;letter-spacing:2px}
.hero .sub{color:var(--ink2);margin:0;font-size:13px}
.hero-meta{display:flex;gap:26px;text-align:right}
.hero-meta .kv b{display:block;font-size:24px;font-family:var(--serif);color:var(--red);line-height:1.2}
.hero-meta .kv span{font-size:12px;color:var(--ink3)}
.tabs{display:flex;gap:2px;margin:22px 0 26px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 17px;color:var(--ink2);white-space:nowrap;font-size:14px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--red);border-bottom-color:var(--red);font-weight:600}
.panel{display:none}.panel.active{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.card h3{margin:0 0 4px;font-size:17px}
.card .muted{color:var(--ink2);font-size:13px}
.sec-title{font-size:19px;margin:0 0 4px}
.sec-desc{color:var(--ink2);font-size:13px;margin:0 0 18px}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;line-height:1.7;border:1px solid transparent}
.b-red{background:var(--red-bg);color:var(--red);border-color:#EED8D2}
.b-green{background:var(--green-bg);color:var(--green);border-color:#D6E5DA}
.b-amber{background:var(--amber-bg);color:var(--amber);border-color:#EDE1C6}
.b-blue{background:var(--blue-bg);color:var(--blue);border-color:#D7E3EC}
.b-gray{background:#F3F1EC;color:var(--ink2);border-color:var(--line)}
.bar{height:8px;background:#EDE9E0;border-radius:8px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .3s}
.todo{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.todo:last-child{border-bottom:0}
.todo input{width:17px;height:17px;accent-color:var(--green);flex:none}
.todo.done span{color:var(--ink3);text-decoration:line-through}
.quote{font-family:var(--serif);font-size:19px;line-height:2;letter-spacing:1px;margin:6px 0 12px}
.quote-src{color:var(--ink2);font-size:13px}
.think{background:var(--amber-bg);border-left:3px solid #D9B96A;padding:12px 14px;border-radius:0 6px 6px 0;margin-top:14px;font-size:13px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden}
.stage-head{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer;user-select:none}
.stage-num{width:34px;height:34px;flex:none;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:16px;color:var(--red)}
.stage.finished .stage-num{background:var(--green-bg);color:var(--green);border-color:#D6E5DA}
.stage-head h3{margin:0;font-size:17px;flex:1}
.stage-body{display:none;padding:0 20px 20px 68px;border-top:1px solid var(--line)}
.stage.open .stage-body{display:block}
.stage-body h4{margin:16px 0 6px;font-size:13px;color:var(--ink2);font-weight:600;letter-spacing:1px}
.stage-body ul{margin:0;padding-left:18px}
.stage-body li{margin:3px 0}
.quiz{background:var(--paper);border-radius:8px;padding:12px 14px;margin-top:8px}
.quiz p{margin:4px 0;font-size:13px}
.chip{display:inline-block;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:3px 9px;margin:3px 5px 3px 0;font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters input,.filters select{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:8px 11px;outline:none}
.filters input:focus,.filters select:focus{border-color:var(--red)}
.fbtn{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;color:var(--ink2);font-size:13px}
.fbtn.on{background:var(--red);color:#fff;border-color:var(--red)}
.res-card{display:flex;flex-direction:column;gap:6px}
.res-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.res-top b{font-size:15px;font-family:var(--serif)}
.res-star{color:var(--red);font-size:13px;white-space:nowrap}
.res-note{color:var(--ink2);font-size:13px;flex:1}
.res-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink3);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--ink2);font-weight:600;background:var(--paper);white-space:nowrap}
td code{background:var(--paper);padding:1px 5px;border-radius:4px;font-size:12px}
pre{background:#2E2B26;color:#F1EDE4;padding:14px 16px;border-radius:8px;overflow-x:auto;font-size:12.5px;line-height:1.8;margin:10px 0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:7px 13px;color:var(--ink);font-size:13px}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
.btn.primary:hover{opacity:.9;color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.form-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.form-row input,.form-row select,.form-row textarea{border:1px solid var(--line);border-radius:7px;padding:9px 11px;background:var(--card);outline:none}
.form-row input:focus,.form-row textarea:focus{border-color:var(--red)}
.form-row .f1{flex:1;min-width:150px}
.form-row textarea{width:100%;min-height:88px;resize:vertical}
.card-item{border:1px solid var(--line);border-radius:9px;padding:15px 17px;background:var(--card);margin-bottom:10px}
.card-item h4{margin:0 0 6px;font-size:15px;font-family:var(--serif)}
.card-item .body{white-space:pre-wrap;font-size:13.5px;margin:6px 0}
.card-item .src{color:var(--ink3);font-size:12px}
.card-item .ops{float:right;display:flex;gap:6px}
.prompt{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--card);margin-bottom:9px}
.prompt p{margin:0 0 8px;font-size:13.5px;white-space:pre-wrap}
.note{background:var(--red-bg);border:1px solid #EED8D2;border-radius:8px;padding:13px 16px;font-size:13px;color:#7E3A32;margin:14px 0}
.ok{background:var(--green-bg);border:1px solid #D6E5DA;border-radius:8px;padding:13px 16px;font-size:13px;color:#35503F;margin:14px 0}
.ansbox{margin:7px 0 0;border:1px dashed var(--line);border-radius:7px;background:var(--paper);padding:7px 10px;font-size:13px}
.ansbox summary{cursor:pointer;color:var(--ink2);font-size:12px;list-style:none;user-select:none}
.ansbox summary::-webkit-details-marker{display:none}
.ansbox summary:before{content:'▸ ';color:#A6433A}
.ansbox[open] summary:before{content:'▾ '}
.ansbox p{margin:7px 0 0;line-height:1.75;color:var(--ink)}
.anslist{margin:0 0 14px;padding-left:20px}
.anslist li{margin-bottom:8px;line-height:1.7}
.timebox{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.timebox span{font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:20px;background:var(--paper);color:var(--ink2)}
.timebox span b{color:#A6433A;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0}
.step{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px}
.step b{display:block;font-family:var(--serif);font-size:15px;margin-bottom:5px}
.step span{font-size:12.5px;color:var(--ink2)}
.foot{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--ink3);font-size:12px;line-height:1.9}
.empty{color:var(--ink3);text-align:center;padding:34px 10px;font-size:13px}
@media(max-width:600px){.wrap{padding:18px 14px 60px}.stage-body{padding-left:20px}.hero-meta{text-align:left}.grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

<div class="hero">
  <div>
    <h1>中医学习工作台</h1>
    <p class="sub">从教材到经典，从条文到医案 —— 一条能积累、能回溯、能自测的学习路径</p>
  </div>
  <div class="hero-meta">
    <div class="kv"><b id="m-progress">0%</b><span>路径完成度</span></div>
    <div class="kv"><b id="m-streak">0</b><span>连续打卡（天）</span></div>
    <div class="kv"><b id="m-cards">0</b><span>学习卡片</span></div>
    <div class="kv"><b id="m-stage">筑基</b><span>当前阶段</span></div>

</div>

<nav class="tabs" id="tabs">

  <button class="tab" data-p="cards">我的卡片</button>

  <button class="tab" data-p="prompts">提问模板</button>
</nav>

<section class="panel active" id="p-overview"></section>
<section class="panel" id="p-course"></section>
<section class="panel" id="p-path"></section>

<section class="panel" id="p-library"></section>

<section class="panel" id="p-sync"></section>

<div class="foot">
  数据仅保存在本机浏览器 localStorage，不上传任何服务器；清理浏览器数据会丢失，请定期用「我的卡片 → 导出备份」。<br>
  本工作台及所引开源项目仅用于中医学习与古籍研读，不构成诊断、处方、用药或剂量建议；身体不适请就诊于执业中医师。<br>
  资源与 star 数核对于 2026-11-13，仓库状态会变化。
</div>
</div>

<script>

const RESOURCES = [

const PLAN = [{"d":1,"date":"2026-11-14","type":"lesson","stage":1,"sn":"筑基 · 中医基础理论","t":"阴阳学说入门","m":"《素问·阴阳应象大论》开篇「阴阳者，天地之道也，万物之纲纪，变化之父母，生杀之本始，神明之府也」","a":"《中医基础理论》阴阳学说章：对立制约、互根互用、消长平衡、相互转化四组关系","f":["「万物之纲纪」的「纲纪」在原句里是名词还是动词？它约束的对象是什么？","四组关系里，哪一组最容易被日常语言混淆？举一个会被说反的例子。"],"fa":["「纲纪」是名词，本指网的总绳与丝缕条理，引申为准则、法度；它约束的是万物运行的秩序，不是某个具体事物。","消长与转化最容易混。日常说「物极必反」常被当成消长，其实那是转化；消长只是量的增减（如昼夜长短），未必越界。"],"w":[["概念卡","分别用一句话定义对立、互根、消长、转化，每句配一个生活例子"],["对比卡","阴阳与五行是两套模型：各自解释什么问题，交界在哪"]],"wa":["对立＝相互制约（寒与热）；互根＝互为存在前提（无上即无下）；消长＝此增彼减（昼夜长短）；转化＝极则变（冰化为水）。","阴阳讲「两方面关系」，五行讲「多要素生克」；交界在都用于归类与推演病机，但五行多了生克链条，能推传变。"],"qz":[["「阴阳者，天地之道也」之后，原文紧接着的是",["万物之纲纪","生杀之本始","神明之府也","变化之父母"],0,"原文顺序为：天地之道也，万物之纲纪，变化之父母，生杀之本始，神明之府也。","《素问·阴阳应象大论》"],["下列哪一项不属于阴阳「对立制约」的表现",["寒者热之","热者寒之","阴盛则阳病","阴损及阳"],3,"「阴损及阳」讲的是阴一方亏虚累及阳，属互根互用；前三项都是以一方制约另一方。","《中医基础理论》阴阳学说章"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":2,"date":"2026-11-15","type":"lesson","stage":1,"sn":"筑基 · 中医基础理论","t":"五行归类","m":"《素问·阴阳应象大论》五行配属段落：木火土金水与五脏、五志、五味的对应","a":"《素问·五运行大论》五气更立一段；教材五行学说章的生克乘侮","f":["五行归类是把事物「分到五个抽屉」，还是描述五类运动趋势？依据在哪？","「相乘」与「相侮」都属病理性克制，方向差在哪一步？"],"fa":["是描述五类运动趋势。《素问》以「木曰曲直、火曰炎上、土爰稼穑、金曰从革、水曰润下」定义，重点在动态特性，不是静态分抽屉。","方向相反：相乘沿相克方向过度（木克土太过）；相侮是反向克制（木虚反被土侮，或土壅木郁）。"],"w":[["概念卡","画出五行生克图，标出母与子，并写出「虚则补其母」的推导路径"],["对比卡","五行之「木」与藏象之「肝」：什么时候可以互换，什么时候不能"]],"wa":["生我者为母，我生者为子；「虚则补其母」＝子脏虚则补母脏，如肺虚补脾（培土生金）。","讲属性归类、治法取象时可互换；讲具体脏腑功能、经络循行时不能互换，否则会把比喻当解剖。"],"qz":[["五行中「木」对应的五味是",["酸","苦","甘","辛"],0,"酸属木、苦属火、甘属土、辛属金、咸属水。","《素问·阴阳应象大论》五行配属"],["「相乘」指的是",["克制太过，沿相克方向过度制约","反向克制，以下犯上","母病及子","子病犯母"],0,"相乘是相克太过；相侮才是反向克制。二者都属病理，方向不同。","《中医基础理论》五行学说章"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":3,"date":"2026-11-16","type":"lesson","stage":1,"sn":"筑基 · 中医基础理论","t":"藏象 · 心","m":"《素问·灵兰秘典论》「心者，君主之官也，神明出焉」","a":"教材藏象章：心主血脉、主神明、开窍于舌、其华在面","f":["「君主之官」是比喻还是功能定位？它解释了心的哪一项特权？","「神明」若只理解为意识思维，会漏掉什么？"],"fa":["兼有二者。作为功能定 及全身正气；须结合上下文，不能一概而论。"],"w":[["概念卡","用正邪相争解释「为什么同一环境有人发病有人不发病」"],["对比卡","正气不足与邪气亢盛：虚实判断里各自的证据"]],"wa":["取决于邪气强弱与正气盛衰的对比，以及体质、情志、起居对正气的消耗。","正虚：病程长、乏力、脉弱、喜按；邪盛：病程短、声高、脉实、拒按。"],"qz":[["「邪之所凑，其气必虚」出自",["《素问·评热病论》","《素问·生气通天论》","《灵枢·百病始生》","《金匮要略》"],0,"此语出自《素问·评热病论》，强调正气亏虚是受邪的前提。","《素问·评热病论》"],["「正气存内，邪不可干」强调的是",["正气充足则邪难侵袭","邪气盛则发病","虚实夹杂","因人制宜"],0,"该句从正面讲正气的主导作用，与「邪之所凑，其气必虚」互为表里。","《素问·遗篇·刺法论》"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":14,"date":"2026-11-27","type":"lesson","stage":1,"sn":"筑基 · 中医基础理论","t":"治则 · 治未病","m":"《素问·四气调神大论》「是故圣人不治已病治未病，不治已乱治未乱」","a":"《金匮要略·脏腑经络先后病脉证》首条「见肝之病，知肝传脾，当先实脾」","f":["《素问》的治未病偏「未病先防」，《金匮》偏「既病防传」，文本依据各在哪句？","「不治已乱治未乱」用政治比喻医学，这个类比掩盖了什么？"],"fa":["《素问》「不治已病治未病，不治已乱治未乱」；《金匮》「见肝之病，知肝传脾，当先实脾」。一个讲未病先防，一个讲既病防传。","掩盖了「乱」的判定标准：政治上乱象可见，人体「未乱」缺乏明确指标，容易流于泛化。"],"w":[["概念卡","把治未病拆成三级：未病先防、既病防变、瘥后防复，各举一例"],["对比卡","治未病与「早发现早治疗」：目标相同，路径差别在哪"]],"wa":["未病先防（起居有常）、既病防变（实脾防肝传）、瘥后防复（热病后食复、劳复）。","目标都是减少损害；路径上，治未病靠养生与截断传变，早诊早治靠筛查与早期干预。"],"qz":[["「圣人不治已病治未病」出自",["《素问·四气调神大论》","《素问·上古天真论》","《金匮要略》","《难经》"],0,"此语出自《素问·四气调神大论》，为治未病思想的经典表述。","《素问·四气调神大论》"],["「见肝之病，知肝传脾，当先实脾」体现的治则是",["治病求本","治未病（既病防传）","调整阴阳","因人制宜"],1,"已知肝病可能传脾，故先实脾以阻断传变，属既病防变。","《金匮要略·脏腑经络先后病脉证》"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":15,"date":"2026-11-28","type":"lesson","stage":1,"sn":"筑基 · 中医基础理论","t":"体质与养生","m":"《灵枢·阴阳二十五人》选读：以五行分二十五种体质","a":"教材体质章：体质形成因素、分类、体质与病证的关系","f":["体质分类若不能指导起居饮食与用药宜忌，它还有存在价值吗？","「同病异治」与「异病同治」，各自依赖体质的哪一层判断？"],"fa":["价值有限。体质学说的落点正是「因人制宜」，脱离干预就只是静态标签。","同病异治依赖体质与阶段差异（同病不同证）；异病同治依赖病机相同（不同病同证）。"],"w":[["概念卡","给自己做一个粗判：偏寒偏热、偏燥偏湿，各写一条依据"],["对比卡","体质与证候：一个是底色，一个是当下状态，如何区分"]],"wa":["依据可看平素怕冷怕热、口渴与否、二便、舌象、出汗；不要单凭一项下结论。","体质长期稳定、决定易感性；证候短期变化、反映当前病机。二者可叠加，不能互相替代。"],"qz":[["体质学说在临床上的主要落点是",["判断寿命长短","指导用药宜忌与起居调摄","确定血型匹配","推断性格"],1,"体质辨识用于指导治疗与养生，属可干预层面。","《中医基础理论》体质章"],["「同病异治」的理论依据主要是",["病名不同","证候不同","体质与病程阶段不同","医生流派不同"],2, 」绑定，而不是与「热」绑定？"],"fa":["淡白主气血不足或阳虚（脉络不充）；红绛主热，红为热盛，绛为热入营血、阴液受损。","胖大是水湿停聚、舌体充盈；齿痕是舌受齿列压迫。热盛多见舌红瘦或红绛，不会胖润。"],"w":[["辨证卡","做一张舌色对照表：淡白、红、绛、紫暗，各写主病与一个典型证"],["对比卡","舌体胖大与舌体瘦薄：一虚一实，机制相反在哪"]],"wa":["淡白→虚寒；红→实热或阴虚；绛→热入营血；紫暗→血瘀或寒凝。","胖大属虚属湿（脾虚水停），瘦薄属虚属燥（阴血不足），一润一干。"],"qz":[["舌质淡白多主",["虚证、寒证","实热证","湿热证","血瘀证"],0,"淡白舌主气血不足或阳气虚衰，属虚、属寒。","《中医诊断学》舌诊章"],["舌体胖大、边有齿痕，最常见于",["脾虚湿盛","阴虚火旺","肝火上炎","心血瘀阻"],0,"脾失健运、水湿内停则舌体胖大，受齿列压迫而现齿痕。","《中医诊断学》舌诊章"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":19,"date":"2026-12-02","type":"lesson","stage":2,"sn":"诊断 · 四诊与辨证","t":"望舌 · 舌苔","m":"教材舌诊章·舌苔：苔色（白、黄、灰黑）、苔质（厚薄、腻腐、剥落、有根无根）","a":"《伤寒论》阳明病苔象相关条文","f":["苔的「有根／无根」在判断什么？为什么它比苔色更基础？","黄苔一定主热吗？有没有例外需要排除？"],"fa":["判断胃气存亡。有根为胃气所生、刮之不去；无根浮而无基，胃气衰败。胃气是底子，苔色只是性质。","一般主热，但薄黄而润、兼寒象者可为表寒化热之初；咖啡、橘子等食物染色也会致假黄，需问诊排除。"],"w":[["辨证卡","写一张苔质对照表：薄、厚、腻、剥，各自主什么"],["对比卡","白腻苔与黄腻苔：同是湿，热的介入改变了什么"]],"wa":["薄→病轻在表；厚→病深或食积痰浊；腻→湿浊痰饮；剥→胃阴不足或胃气损伤。","白腻偏寒湿，黄腻偏湿热；热的介入使苔转黄，湿的底子仍在（腻）。"],"qz":[["黄腻苔多主",["湿热或痰热","寒湿","气血两虚","阴虚"],0,"苔黄主热、苔腻主湿浊，黄腻并见多属湿热或痰热内蕴。","《中医诊断学》舌诊章"],["舌苔「有根」指的是",["苔紧贴舌面、刮之不去，为胃气所生","苔厚如积粉","苔色发黑","苔剥落殆尽"],0,"有根之苔紧贴舌面、不易刮去，说明胃气尚存；无根之苔浮而无基，多属胃气衰败。","《中医诊断学》舌诊章"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":20,"date":"2026-12-03","type":"review","stage":2,"t":"学情检查 · 第 5 次","from":[17,18,19],"qs":[["望神的重点在于观察",["目光、神情、气色、体态","舌苔厚薄","脉象迟数","问诊十项"],0,"神之外候主要在目，兼看神情、气色、体态；「神藏于心，外候在目」。","《中医诊断学》望诊章"],["舌质淡白多主",["虚证、寒证","实热证","湿热证","血瘀证"],0,"淡白舌主气血不足或阳气虚衰，属虚、属寒。","《中医诊断学》舌诊章"],["舌体胖大、边有齿痕，最常见于",["脾虚湿盛","阴虚火旺","肝火上炎","心血瘀阻"],0,"脾失健运、水湿内停则舌体胖大，受齿列压迫而现齿痕。","《中医诊断学》舌诊章"],["黄腻苔多主",["湿热或痰热","寒湿","气血两虚","阴虚"],0,"苔黄主热、苔腻主湿浊，黄腻并见多属湿热或痰热内蕴。","《中医诊断学》舌诊章"],["舌苔「有根」指的是",["苔紧贴舌面、刮之不去，为胃气所生","苔厚如积粉","苔色发黑","苔剥落殆尽"],0,"有根之苔紧贴舌面、不易刮去，说明胃气尚存；无根之苔浮而无基，多属胃气衰败。","《中医诊断学》舌诊章"]],"an":{"quiz":"学情检查 5 题均为单选，答案见 questions[].a，解析见 why，出处见 src。","note":"错题按 src/why 回看对应学习日的精读与参考答案，再进入新内容。"},"dur":20,"box":[["5 道学情检查（选完出解析）",10],["错题回看前 3 天",10]]},{"d":21,"date":"2026-12-04","type":"lesson","stage":2,"sn":"诊断 · 四诊与辨证","t":"闻诊与问诊","m":"《素问·疏五过论》「凡欲诊病者，必问饮食居处」","a":"教材闻诊章：听声音（语声、呼吸、咳嗽）、嗅气味","f":["为什么问诊要先问饮食居处，而不是先问主症？顺序背后是什么假设？","声音的高低强弱，反映的是气的什么状态？"],"fa":["主症是结果，饮食居处是成因与背景；先取生活史可判断病性与可干预因素，避免被单一症状带走。","反映气的盛衰与升降：声高有力多实，声低无力多虚；气逆则声粗气促，气陷则语声低微。"],"w":[["辨证卡","列出闻诊四类信息（语声、呼吸、咳嗽、气味）各能提示什么"],["对比卡","问诊的「开放式提问」与「封闭式提问」：各在什么阶段用"]],"wa":["语声（高低强弱）、呼吸（粗细长短）、咳嗽（声重声哑、有无痰）、气味（口气、体味、排出物）。","开场用开放式（哪里不舒服、多久了）收集信息；收束用封闭式（是否口苦、夜间是否加重）确认鉴别点。"],"qz":[["闻诊包括",["听声音与嗅气味","只看舌象","只问症状","只切脉象"],0,"闻诊含听声音与嗅气味两部分。","《中医诊断学》闻诊章"],["「凡欲诊病者，必问饮食居处」出自",["《素问·疏五过论》","《素问·经脉别论》","《灵枢·决气》","《难经》"],0,"此语出自《素问·疏五过论》，强调诊病须究生活起居之因。","《素问·疏五过论》"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":22,"date":"2026-12-05","type":"lesson","stage":2,"sn":"诊断 · 四诊与辨证","t":"十问与问渴","m":"教材问诊章·十问歌：「一问寒热二问汗，三问头身四问便……」","a":"《景岳全书·传忠录》十问篇","f":["问「渴」为什么要区分欲饮、不欲饮、喜冷喜热？各自排除什么？","十问的顺序不是随意的，它按什么逻辑排列？"],"fa":["欲饮多津伤（热盛或阴虚）；不欲饮多湿阻或阳虚；喜冷为热，喜热为寒。一口水之差，辨的是寒热与津伤。","从外到内、从症到因：寒热汗（表与阴阳）、头身便（上下）、饮食胸腹（中焦）、耳目口（清窍）、睡眠情志、既往与妇人。"],"w":[["辨证卡","把十问改写成你自己的问诊清单，按重要性重排并注明理由"],["对比卡","口渴喜冷饮与口渴不欲饮：一热一湿，机制差在哪"]],"wa":["可按「主诉—寒热汗—饮食二便—睡眠情志—妇儿—既往用药」重排，把你的问诊习惯固化下来。","喜冷饮属热盛伤津；渴不欲饮属湿阻气化或瘀血，水津不布，不是真缺水。"],"qz":[["十问歌首问是",["寒热","汗","头身","二便"],0,"十问歌：「一问寒热二问汗，三问头身四问便……」寒热居首。","《中医诊断学》问诊章"],["口渴喜冷饮多提示",["热证","寒证","湿证","血瘀"],0,"热盛伤津则口渴喜冷饮；寒证多口不渴或喜热饮；湿证多渴不欲饮。","《中医诊断学》问诊章"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":23,"date":"2026-12-06","type":"lesson","stage":2,"sn":"诊断 · 四诊与辨证","t":"切诊 · 脉位脉率","m":"《濒湖脉学》浮、沉、迟、数四脉歌诀","a":"教材脉诊章：寸口诊法、浮沉迟数虚实六纲脉","f":["浮脉主表，有没有例外？举一个并说明为什么。","「脉位」与「脉率」是两个独立维度，为什么初学者常混在一起？"],"fa":["有。久病虚阳外越可见浮大无根；体瘦者、夏季阳气外浮也见浮。关键看有力无力与兼脉。","因为都靠指下感觉，且常同时异常（如浮数）；但脉位讲深浅，脉率讲快慢，须分开描述再合参。"],"w":[["辨证卡","为浮、沉、迟、数各写一条「指下感觉 + 主病 + 一个例外」"],["对比卡","浮脉与虚脉：都可有「无力」，鉴别点在哪"]],"wa":["浮（举之有余按之不足，主表）；沉（重按始得 、并病，各配一条原文"],["对比卡","《素问·热论》与《伤寒论》的六经：同名而义同吗"]],"wa":["传经（循经或越经）、合病（同时）、并病（先后），各配一条原文。","同名而义不同：热论六经按日传、重经络；伤寒六经重脉证与方治，是辨证体系而非计时表。"],"qz":[["判断伤寒传经的主要依据是",["脉证变化","发病天数","患者年龄","季节"],0,"仲景以脉证为凭，不机械按日数传经；第 16 条即强调观其脉证。","《伤寒论》"],["「并病」指的是",["一经病证未罢，又见他经病证","两经同时受邪","表里同病","虚实夹杂"],0,"并病为一经未愈又传他经；合病为两经或三经同时受邪。","《伤寒论》"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":76,"date":"2027-01-28","type":"review","stage":5,"t":"学情检查 · 第 19 次","from":[73,74,75],"qs":[["少阳病提纲的原文是",["口苦、咽干、目眩也","胃家实是也","腹满而吐，食不下","消渴，气上撞心"],0,"第 263 条为少阳病提纲，以口苦、咽干、目眩为纲。","《伤寒论》第 263 条"],["少阴病提纲的原文是",["脉微细，但欲寐也","胃家实是也","口苦咽干目眩也","腹满而吐，食不下"],0,"第 281 条以脉微细、但欲寐概括少阴病心肾阳衰、阴阳俱虚之候。","《伤寒论》第 281 条"],["太阴病提纲的主症是",["腹满而吐，食不下，自利益甚，时腹自痛","消渴，气上撞心","脉微细，但欲寐","口苦咽干目眩"],0,"第 273 条为太阴病提纲，属脾阳虚弱、寒湿内盛。","《伤寒论》第 273 条"],["判断伤寒传经的主要依据是",["脉证变化","发病天数","患者年龄","季节"],0,"仲景以脉证为凭，不机械按日数传经；第 16 条即强调观其脉证。","《伤寒论》"],["「并病」指的是",["一经病证未罢，又见他经病证","两经同时受邪","表里同病","虚实夹杂"],0,"并病为一经未愈又传他经；合病为两经或三经同时受邪。","《伤寒论》"]],"an":{"quiz":"学情检查 5 题均为单选，答案见 questions[].a，解析见 why，出处见 src。","note":"错题按 src/why 回看对应学习日的精读与参考答案，再进入新内容。"},"dur":20,"box":[["5 道学情检查（选完出解析）",10],["错题回看前 3 天",10]]},{"d":77,"date":"2027-01-29","type":"lesson","stage":5,"sn":"经典 · 条文与医家","t":"金匮 · 治未病","m":"《金匮要略·脏腑经络先后病脉证》首条「见肝之病，知肝传脾，当先实脾」","a":"《素问·四气调神大论》治未病段对照","f":["「当先实脾」为什么不先治肝？背后是怎样的传变观？","「四季脾旺不受邪」在这条里起什么作用？"],"fa":["不先治肝，是因为「见肝之病，知肝传脾」：木乘土是最常见的传变路径，脾未病而先固之，即截断传变。治肝是治已病，实脾是治未病，二者并行不悖，条文批评的正是「不晓相传，惟治肝也」的中工。","它是「实脾」之所以可行的理论依据：脾气旺于四季之末，脾旺则不受肝邪，说明防传的落点在扶助正气而非攻邪；同时也限定「实脾」是调补脾运，不是壅补，更不是见肝就补脾。"],"w":[["条文卡","抄首条，画出「肝病 → 传脾 → 实脾」的逻辑链"],["对比卡","《素问》与《金匮》的治未病：预防与防传的分工"]],"wa":["抄首条「问曰：上工治未病，何也……当先实脾」。逻辑链：见肝之病（已病）→ 知肝传脾（五行木乘土）→ 当先实脾（截断）→ 四季脾旺不受邪（依据）→ 中工惟治肝（反例）。五步各标原文对应句。","《素问·四气调神大论》「治未病」指未病先防，靠顺应四时养生、不令邪生；《金匮》指既病防传，已病之后按传变规律先安未受邪之脏。一在无病时，一在已病后，层次不同但共用「上工」标准。"],"qz":[["「见肝之病，知肝传脾，当先实脾」体现的治则是",["既病防传","未病先防","瘥后防复","急则治标"],0,"已病之后预判传变方向并先安未受邪之地，属既病防变。","《金匮要略》首篇"],["该条中「实脾」的目的是",["先安未受邪之地，阻断传变","直接治肝","健脾以化痰","补脾以生血"],0,"实脾即先补脾土，使肝病不得传脾，属治未病之既病防变。","《金匮要略》首篇"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":78,"date":"2027-01-30","type":"lesson","stage":5,"sn":"经典 · 条文与医家","t":"金匮 · 杂病选读","m":"library/金匮要略.txt 选一篇：痉湿暍病脉证治","a":"《金匮要略》脏腑经络先后病篇的辨证方法","f":["这一篇的辨证框架，与六经辨证有何不同？","「痉」与「湿」同篇，共同点在哪？"],"fa":["六经是纵向的：以外感热病的时间阶段与寒热虚实转归为纲，一经可含多证，随传变转方；金匮是横向的：按病种分篇，以脏腑经络定病位、以脉证定方，同一病可跨数经。前者问「走到哪一步」，后者问「是什么病」。","共同点是「外邪袭表 + 津液输布失常」：痉为津伤筋脉失养而项背强急，湿为湿遏阳气、身重烦疼；二者都忌过汗伤津，故同篇互参，提示「见表证不可一律发汗」。"],"w":[["条文卡","选三条抄录，各写一句「症状 → 病机」"],["对比卡","金匮杂病辨证与伤寒六经辨证：一横向一纵向"]],"wa":["示例三句：①「太阳病，发热无汗，反恶寒者，名曰刚痉」→ 风寒束表、津不上承；②「太阳病，发热汗出而不恶寒，名曰柔痉」→ 腠理疏、津液外泄；③「湿家之为病，一身尽疼，发热，身色如熏黄也」→ 湿郁肌表、阳气不宣。每条按「症状 → 病机」两栏写。","金匮横向：以病名为纲（痉、湿、暍、百合……），一病对应一组方证，重在鉴别同类病；伤寒纵向：以六经为纲，重在传变次第与转方时机。合用次序：先定病种，再看处于何经、何阶段。"],"qz":[["《金匮要略》主要论述",["内伤杂病与妇人病","外感热病","本草药性","针灸腧穴"],0,"《金匮要略》为《伤寒杂病论》杂病部分，论内伤杂病及妇人病。","《金匮要略》"],["《金匮要略》与《伤寒论》的关系是",["同出《伤寒杂病论》，一论杂病一论伤寒","完全独立的两本书","后者是前者的注解","前者是后者的方剂附录"],0,"二书同源于张仲景《伤寒杂病论》，后世分为伤寒与杂病两部分。","《金匮要略》序"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":79,"date":"2027-01-31","type":"lesson","stage":5,"sn":"经典 · 条文与医家","t":"病机十九条","m":"《素问·至真要大论》病机十九条","a":"教材病机章；刘完素《素问玄机原病式》对十九条的发挥","f":["十九条里，哪几条最容易与临床直觉相冲突？为什么？","「皆属于」的「皆」，是全部还是多半？"],"fa":["最易冲突的是「诸风掉眩，皆属于肝」与「诸痛痒疮，皆属于心」：临床眩晕常见于痰饮上泛、气血亏虚，疮疡亦多湿热、寒凝，若一律治肝、清心便误。冲突根源是把归类提示读成排他性病因，忽略了条文是「示人以规矩」。","宜读作「多属 / 可归属于」，不是全称量词。十九条本身五脏与六气互有交叉（如「诸热瞀瘛」属火、「诸痉项强」属湿），若作「全部」则自相矛盾；它的用处是给出一条从症状之象反推病机的检索路径，而非封闭结论。"],"w":[["条文卡","抄十九条，按五脏、六气两类重新归类"],["对比卡","「诸风掉眩」与「诸寒收引」：一条属肝一条属肾，归类依据是什么"]],"wa":["按两类重抄：五脏 5 条（诸风掉眩属肝、诸痛痒疮属心、诸湿肿满属脾、诸气膹郁属肺、诸寒收引属肾）；其余 14 条为火 5、热 4、风 1、寒 1、湿 1、属上 1、属下 1。注明「诸涩枯涸…皆属于燥」是刘完素后世补入，非《素问》原文，共 19 条勿数成 20。","「诸风掉眩」归肝，因肝主风、藏血濡筋、开窍于目，动摇眩转之风象与肝所主之气相应；「诸寒收引」归肾，因肾主冬主寒水，寒性收引、阳不温煦则筋脉拘急。归类依据是「症状之象」配「五脏所主」，属功能归类，不是解剖定位。"],"qz":[["「诸湿肿满，皆属于」",["脾","肝","肾","肺"],0,"病机十九条：诸湿肿满，皆属于脾；诸风掉眩，皆属于肝；诸寒收引，皆属于肾。","《素问·至真要大论》"],["「诸气膹郁，皆属于」",["肺","肝","脾","心"],0,"诸气膹郁，皆属于肺，指气机郁滞、胸满喘急多责之于肺。","《素问·至真要大论》"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":80,"date":"2027-02-01","type":"review","stage":5,"t":"学情检查 · 第 20 次","from":[77,78,79],"qs":[["「见肝之病，知肝传脾，当先实脾」体现的治则是",["既病防传","未病先防","瘥后防复","急则治标"],0,"已病之后预判传变方向并先安未受邪之地，属既病防变。","《金匮要略》首篇"],["《金匮要略》主要论述",["内伤杂病与妇人病","外感热病","本草药性","针灸腧穴"],0,"《金匮要略》为《伤寒杂病论》杂病部分，论内伤杂病及妇人病。","《金匮要略》"],["《金匮要略》与《伤寒论》的关系是",["同出《伤寒杂病论》，一论杂病一论伤寒","完全独立的两本书","后者是前者的注解","前者是后者的方剂附录"],0,"二书同源于张仲景《伤寒杂病论》，后世分为伤寒与杂病两部分。","《金匮要略》序"],["「诸湿肿满，皆属于」",["脾","肝","肾","肺"],0,"病机十九条：诸湿肿满，皆属于脾；诸风掉眩，皆属于肝；诸寒收引，皆属于肾。","《素问·至真要大论》"],["「诸气膹郁，皆属于」",["肺","肝","脾","心"],0,"诸气膹郁，皆属于肺，指气机郁滞、胸满喘急多责之于肺。","《素问·至真要大论》"]],"an":{"quiz":"学情检查 5 题均为单选，答案见 questions[].a，解析见 why，出处见 src。","note":"错题按 src/why 回看对应学习日的精读与参考答案，再进入新内容。"},"dur":20,"box":[["5 道学情检查（选完出解析）",10],["错题回看前 3 天",10]]},{"d":81,"date":"2027-02-02","type":"lesson","stage":5,"sn":"经典 · 条文与医家","t":"上古天真论","m":"《素问·上古天真论》全篇：法于阴阳、和于术数、食饮有节、起居有常","a":"《素问·四气调神大论》四时养生","f":["「和于术数」的「数」，与「食饮有节」是同一层要求吗？","「恬淡虚无，真气从之」是心理建议还是病机判断？"],"fa":["不同层：「法于阴阳」是总原则，「和于术数」指合乎天地节律与调摄法度（四时、昼夜、导引按蹻等），属方法层；「食饮有节」与「起居有常」「不妄作劳」并列，是具体行为条目，属执行层。由原则到方法再到行为，共三层。","两层兼有。表面是养神的心理要求（少私寡欲、心安不扰），但原文紧接着「精神内守，病安从来」，把它放进病机链条：神不外驰则气机不乱、真气顺行，正气充而邪不可干。所以不只是劝人静心，而是一条「神—气—邪」的判断。"],"w":[["条文卡","抄「法于阴阳……度百岁乃去」一段，逐句翻译"],["对比卡","上古天真论与四气调神大论：一论总则一论四时"]],"wa":["逐句译：法于阴阳（以阴阳消长为法则）／和于术数（调摄合乎天地法度）／食饮有节（饮食有节度）／起居有常（作息有规律）／不妄作劳（不妄耗形与神）／故能形与神俱（形体精神相守不离）／而尽终其天年（享尽天赋寿数）／度百岁乃去（百岁方逝）。","上古天真论立「总则」：以肾气盛衰为轴讲生命周期、养生根本与「形神俱」；四气调神大论给「四时执行表」：春夏秋冬各该何时起卧、如何调志、逆之伤何脏。一立纲、一落日程；后者是前者在时间维度上的展开。"],"qz":[["「法于阴阳，和于术数」之后接",["食饮有节，起居有常，不妄作劳","恬淡虚无，真气从之","虚邪贼风，避之有时","志闲而少欲"],0,"原文：法于阴阳，和于术数，食饮有节，起居有常，不妄作劳，故能形与神俱。","《素问·上古天真论》"],["「恬淡虚无，真气从之」强调的是",["情志调摄对正气的影响","药物补益","饮食禁忌","针灸调气"],0,"该句论精神内守、情志安定则真气和顺，属养生总则。","《素问·上古天真论》"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":82,"date":"2027-02-03","type":"lesson","stage":5,"sn":"经典 · 条文与医家","t":"温热论纲领","m":"《温热论》「温邪上受，首先犯肺，逆传心包」及卫气营血四层","a":"叶天士《温热论》论透热转气、凉血散血","f":["卫气营血是四个阶段，还是四种病位？依据在哪句？","「逆传」的「逆」相对什么而言？"],"fa":["既是病位也是阶段，以病位为体、以阶段为用。叶氏「肺主气属卫，心主血属营」把卫气营血配属脏腑部位；「大凡看法，卫之后方言气，营之后方言血」又明说传变次第。故不可只读成四个时间点，也不可只读成四层深浅。","相对「顺传」而言。顺传是循次第由卫入气、由气入营、由营入血，或由肺卫顺传中焦阳明气分；逆传是邪不循次序、从肺卫直陷心包营分，突起神昏谵语、舌绛，故原文特指「逆传心包」。"],"w":[["条文卡","抄纲领句，画出顺传与逆传两条路径"],["对比卡","卫分证与气分证：热势、舌象、治法三步对照"]],"wa":["纲领句：「温邪上受，首先犯肺，逆传心包；肺主气属卫，心主血属营，辨营卫气血虽与伤寒同，若论治法则与伤寒大异也。」画两条箭头：顺传 肺卫 → 气分（胃）→ 营 → 血；逆传 肺卫 → 心包（营），旁注「神昏、谵语、舌绛」三个识别点。","卫分：发热微恶寒、无汗或少汗、舌边尖红苔薄白、脉浮数，治以辛凉透表（银翘散）；气分：但热不寒、大汗大渴、苔黄燥、脉洪大，治以清气生津（白虎汤）。三步对照：热势由「恶寒发热」转「但热不寒」，舌由薄白转黄燥，治法由「透」转「清」。"],"qz":[["「温邪上受，首先犯肺，逆传心包」出自",["《温热论》","《温病条辨》","《湿热病篇》","《伤寒论》"],0,"此为叶天士《温热论》开篇纲领，创卫气营血辨证。","《温热论》"],["卫气营血辨证的创立者是",["叶天士","吴鞠通","薛生白","王孟英"],0,"叶天士创卫气营血辨证；吴鞠通创三焦辨证；薛生白著《湿热病篇》。","《温热论》"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":83,"date":"2027-02-04","type":"lesson","stage":5,"sn":"经典 · 条文与医家","t":"三焦辨证","m":"《温病条辨》上焦篇开篇；吴鞠通三焦辨证体系","a":"《温病条辨》中焦、下焦篇纲领","f":["三焦与卫气营血两套坐标，是竞争关系还是互补关系？","上焦、中焦、下焦各对应哪些脏腑？"],"fa":["互补而非竞争。三焦按脏腑部位与上下传变给「位置轴」，卫气营血按邪热深浅给「层次轴」；同一病例完全可以并称「上焦·卫分」或「中焦·气分」。一定位置、一定深浅，两个坐标交叉才有完整定位，吴氏原书本身即两法混用。","上焦：心、肺（含心包）；中焦：脾、胃、大肠（胆亦多归中焦）；下焦：肝、肾、膀胱与大小肠部分。依据「上焦病不治，则传中焦，胃与脾也；中焦病不治，即传下焦，肝与肾也」，可见三焦既是部位也是传变段落。"],"w":[["条文卡","画三焦—脏腑对应表，各写一条代表证候"],["对比卡","三焦辨证与卫气营血辨证：一横一纵，如何合用"]],"wa":["三行表：上焦·肺 → 发热微恶寒、咳、脉浮数 → 银翘散；中焦·胃 → 高热大汗、大渴、脉洪大 → 白虎汤；下焦·肝肾 → 身热面赤、手足心热甚于手足背、舌绛少苔、脉虚大 → 加减复脉汤。每行注明「定位依据」。","三焦是「自上而下」的纵向脏腑坐标，重传变趋势与湿邪流走；卫气营血是「由浅入深」的横向层次坐标，重伤阴程度与治法转档。合用：先定何焦（病位与走向），再定何分（宜透、宜清、宜凉血散血）。湿温多倚三焦，温热多倚卫气营血。"],"qz":[["三焦辨证的创立者是",["吴鞠通","叶天士","薛生白","吴又可"],0,"吴鞠通著《温病条辨》，创三焦辨证。","《温病条辨》"],["温病上焦病位主要在",["肺与心包","脾胃","肝肾","膀胱"],0,"上焦包括手太阴肺与手厥阴心包；中焦属脾胃；下焦属肝肾。","《温病条辨》上焦篇"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":84,"date":"2027-02-05","type":"review","stage":5,"t":"学情检查 · 第 21 次","from":[81,82,83],"qs":[["「法于阴阳，和于术数」之后接",["食饮有节，起居有常，不妄作劳","恬淡虚无，真气从之","虚邪贼风，避之有时","志闲而少欲"],0,"原文：法于阴阳，和于术数，食饮有节，起居有常，不妄作劳，故能形与神俱。","《素问·上古天真论》"],["「温邪上受，首先犯肺，逆传心包」出自",["《温热论》","《温病条辨》","《湿热病篇》","《伤寒论》"],0,"此为叶天士《温热论》开篇纲领，创卫气营血辨证。","《温热论》"],["卫气营血辨证的创立者是",["叶天士","吴鞠通","薛生白","王孟英"],0,"叶天士创卫气营血辨证；吴鞠通创三焦辨证；薛生白著《湿热病篇》。","《温热论》"],["三焦辨证的创立者是",["吴鞠通","叶天士","薛生白","吴又可"],0,"吴鞠通著《温病条辨》，创三焦辨证。","《温病条辨》"],["温病上焦病位主要在",["肺与心包","脾胃","肝肾","膀胱"],0,"上焦包括手太阴肺与手厥阴心包；中焦属脾胃；下焦属肝肾。","《温病条辨》上焦篇"]],"an":{"quiz":"学情检查 5 题均为单选，答案见 questions[].a，解析见 why，出处见 src。","note":"错题按 src/why 回看对应学习日的精读与参考答案，再进入新内容。"},"dur":20,"box":[["5 道学情检查（选完出解析）",10],["错题回看前 3 天",10]]},{"d":85,"date":"2027-02-06","type":"lesson","stage":5,"sn":"经典 · 条文与医家","t":"湿热病篇","m":"《湿热病篇》提纲条文；薛生白论湿热","a":"《温病条辨》湿温相关条文；湿温三禁","f":["湿与热合，为什么治法上比单纯清热更受约束？","「湿温三禁」禁的是哪三法？各因何而禁？"],"fa":["因两邪性质相反而互相掣肘：湿为阴邪，黏滞重着，非温不化；热为阳邪，宜清宜寒，寒凉又助湿凝。单清热则湿不去、热反郁；单温燥则助热伤津；汗、下、滋腻各有弊端。故只能「分解湿热」，宣上、畅中、渗下，使湿去而热孤。","禁汗、禁下、禁润（滋阴）。吴鞠通：「汗之则神昏耳聋，甚则目瞑不欲言；下之则洞泄；润之则病深不解。」汗伤卫阳而湿不化，下伤脾阳致湿邪下陷，滋润腻助湿令湿热胶结。三禁的共同前提是「湿重于热或湿热并重」。"],"w":[["条文卡","抄湿热提纲，注明「始恶寒、后但热不寒」的演变"],["对比卡","湿温与温热：起病、传变、治法三处差别"]],"wa":["薛生白《湿热病篇》首条：「湿热病，始恶寒，后但热不寒，汗出胸痞，舌白或黄，口渴不引饮。」注：初起湿遏卫阳故恶寒；湿郁渐化热则但热不寒；胸痞、苔白或黄、渴不引饮，皆是湿重于热、津未大伤之据。","湿温：起病缓、身热不扬、头身困重、胸痞苔腻、口不渴或渴不引饮、病程缠绵，治宜化湿分消兼清热；温热：起病急、高热烦渴、苔黄燥、易入营血动风，治宜清热保津。核心差别只在「有无黏滞之湿」决定能否径用寒凉。"],"qz":[["《湿热病篇》的作者是",["薛生白","叶天士","吴鞠通","王孟英"],0,"《湿热病篇》为薛生白所著，专论湿热病证治。","《湿热病篇》"],["「湿温三禁」通常指",["禁汗、禁下、禁润","禁吐、禁下、禁补","禁汗、禁吐、禁清","禁补、禁涩、禁温"],0,"湿温初起，汗之则神昏耳聋，下之则洞泄，润之则病深不解，故有三禁。","《温病条辨》"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":86,"date":"2027-02-07","type":"lesson","stage":5,"sn":"经典 · 条文与医家","t":"寒温之辨","m":"对照《伤寒论》太阳病篇与《温病条辨》上焦篇","a":"《温热经纬》诸家论寒温之异","f":["伤寒与温病的分歧，根子在病因认识还是传变模型？","「辛温解表」与「辛凉解表」，各自的前提条件是什么？"],"fa":["根子在病因认识，传变模型是推论结果。伤寒以寒邪伤阳、从皮毛而入、循六经由表入里立论；温病以温邪从口鼻上受、首先犯肺、易化燥伤阴立论。入侵途径与邪气性质不同，才有六经 vs 卫气营血/三焦，以及辛温顾阳 vs 辛凉护阴的治法分流。","辛温解表前提是「风寒束表」：恶寒重发热轻、无汗（或汗出恶风）、头身痛、口不渴、舌淡苔薄白、脉浮紧/浮缓，代表麻黄汤、桂枝汤。辛凉解表前提是「风热犯肺卫」：发热重恶寒轻、咽痛、口渴、舌边尖红苔薄黄、脉浮数，代表银翘散、桑菊饮。风热误投辛温，则助热伤津、咽痛加剧。"],"w":[["概念卡","写一张寒温对照表：病因、初起证、治法、代表方"],["对比卡","麻黄汤与银翘散：同治初起外感，寒温两途如何分"]],"wa":["四行表：病因 风寒／风热；初起证 恶寒重无汗头身痛／发热重微恶寒咽痛口渴；治法 辛温发汗、顾护阳气／辛凉透表、顾护津液；代表方 麻黄汤／银翘散。补两行：传变 六经由表入里／卫气营血由浅入深；禁忌 表虚自汗、津亏者禁峻汗／湿温初起、苔腻者忌纯用寒凉。","麻黄汤：麻黄、桂枝、杏仁、甘草，辛温发汗、宣肺平喘，针对风寒表实「无汗而喘」；银翘散：银花、连翘、荆芥穗、薄荷、牛蒡子、桔梗、竹叶、芦根等，辛凉透表兼清热解毒，针对风热卫分。同是外感初起，辨别抓手是恶寒与发热孰重、有汗无汗、咽痛口渴与否、舌苔白或黄。"],"qz":[["伤寒与温病在初起治法上的主要差别是",["伤寒用辛温解表，温病用辛凉解表","伤寒用补法，温病用泻法","伤寒用针灸，温病用药","无差别"],0,"伤寒初起寒邪束表，宜辛温解表；温病初起温邪犯肺，宜辛凉透表。","《温病条辨》"],["温病学派与伤寒学派分歧的焦点之一是",["温邪是否可径用辛温发汗","是否使用针灸","是否重视脉诊","是否使用汤剂"],0,"温病忌辛温发汗，恐助热伤津；伤寒则以辛温解表为正治。","《温热经纬》"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":87,"date":"2027-02-08","type":"lesson","stage":5,"sn":"经典 · 条文与医家","t":"条文互证","m":"自选三条互见条文对照阅读（如太阳提纲、少阳提纲、温热论纲领）","a":"library/ 内多部古籍交叉检索","f":["同一概念在不同条文里的用法一致吗？不一致说明了什么？","互证时，你以哪一部书为准？依据是什么？"],"fa":["不一致是常态，且正说明概念随学术语境演进。「伤寒」在《素问·热论》是外感热病总名，在《难经·五十八难》「伤寒有五」是广义外感病的统称，在《伤寒论》第 3 条则收窄为太阳表实证；「阴阳」在《内经》多指天地与人身的关系模型，到后世又作八纲总纲。跨书直译必误。","不固定以某一部书为准，而以「所论问题所属的语境」为准：基础概念溯《内经》，方证以《伤寒论》《金匮》本文为准，温热以叶天士、吴鞠通为准，注家之说单列不混入原文；一律标书名、篇名或条文号与版本，并区分「原文 / 某注 / 我的按语」三类。"],"w":[["条文卡","选三条互见条文，列表比较关键词的用法差异"],["概念卡","写一段「我的引文规则」：引用时如何标注出处与版本"]],"wa":["三条互见示例：①「伤寒一日，巨阳受之」（《素问·热论》）——热病总名；②「伤寒有五：有中风，有伤寒，有湿温，有热病，有温病」（《难经·五十八难》）——广义总称下含狭义伤寒；③「太阳病，或已发热，或未发热，必恶寒……名曰伤寒」（《伤寒论》第 3 条）——太阳表实证。表格列「出处／伤寒所指／宽窄」。","我的引文规则：① 标书名 + 篇名/条文号 + 版本（如明赵开美校刻《伤寒论》第 12 条）；② 原文加引号，注家说标「某某注」，自己的推断另起「按」；③ 不跨书混用同名术语，借用必注明语义转换；④ 古籍用公版或权威点校本，现代教材只作参照、不全文引用；⑤ 卡片与引文一一对应，可回查到页。"],"qz":[["条文互证的首要前提是",["确认版本与条文编号，避免张冠李戴","记住尽可能多的条文","只看注家解释","只读一家之言"],0,"互证须先确定文本来源与编号，否则比较失去基准。","文献学常识"],["引用古籍时最稳妥的做法是",["标注书名、篇名（或条文号），并核对原文","只写书名","凭记忆引用","只写作者"],0,"可核对的出处是学术引用的底线，也便于他人复核。","文献学常识"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":88,"date":"2027-02-09","type":"review","stage":5,"t":"学情检查 · 第 22 次","from":[85,86,87],"qs":[["《湿热病篇》的作者是",["薛生白","叶天士","吴鞠通","王孟英"],0,"《湿热病篇》为薛生白所著，专论湿热病证治。","《湿热病篇》"],["伤寒与温病在初起治法上的主要差别是",["伤寒用辛温解表，温病用辛凉解表","伤寒用补法，温病用泻法","伤寒用针灸，温病用药","无差别"],0,"伤寒初起寒邪束表，宜辛温解表；温病初起温邪犯肺，宜辛凉透表。","《温病条辨》"],["温病学派与伤寒学派分歧的焦点之一是",["温邪是否可径用辛温发汗","是否使用针灸","是否重视脉诊","是否使用汤剂"],0,"温病忌辛温发汗，恐助热伤津；伤寒则以辛温解表为正治。","《温热经纬》"],["条文互证的首要前提是",["确认版本与条文编号，避免张冠李戴","记住尽可能多的条文","只看注家解释","只读一家之言"],0,"互证须先确定文本来源与编号，否则比较失去基准。","文献学常识"],["引用古籍时最稳妥的做法是",["标注书名、篇名（或条文号），并核对原文","只写书名","凭记忆引用","只写作者"],0,"可核对的出处是学术引用的底线，也便于他人复核。","文献学常识"]],"an":{"quiz":"学情检查 5 题均为单选，答案见 questions[].a，解析见 why，出处见 src。","note":"错题按 src/why 回看对应学习日的精读与参考答案，再进入新内容。"},"dur":20,"box":[["5 道学情检查（选完出解析）",10],["错题回看前 3 天",10]]},{"d":89,"date":"2027-02-10","type":"lesson","stage":6,"sn":"临证 · 医案与复盘","t":"医案读法","m":"选读 library/ 中一部医案类古籍的序或开篇（如《名医类案》体例）","a":"教材医案书写规范：时间、姓名、主诉、现病史、舌脉、诊断、治法、方药、转归","f":["把一段医案拆成「原文写明的事实」与「后人的推断」两栏，界线在哪？","医案里的「无效」记录，为什么比「效如桴鼓」更有学习价值？"],"fa":["界线在「能否在原文里逐字指认」。事实：就诊时间、患者信息、主诉、症状体征、舌脉、方药剂量与煎服法、复诊结果；推断：病机判断、证型命名、方义解释、为何取效。凡带「此为」「盖因」「所以」「法当」的句子，以及后世按语，基本都属推断层，须单独剥离。","有效案只证明一次吻合，无法告诉你边界在哪；无效案暴露了被漏掉的线索、被误判的病机与方证的适用条件，可证伪、可修正假设，还能看到医家依据什么指标改方、何时转向。可复盘的错误比可模仿的成功信息量更大。"],"w":[["医案卡","选一则医案，按九项要素逐条摘录，缺项标注「原文未载」"],["对比卡","事实与推断：各摘三句，说明你的判断依据"]],"wa":["九项要素：①医家与出处 ②时代／地域 ③患者性别年龄 ④主诉与起病经过 ⑤症状体征 ⑥舌象脉象 ⑦诊断与病机 ⑧方药剂量、煎服法 ⑨转归与复诊。凡原文没有的，一律写「原文未载」，绝不用今人知识或常识补写，否则事实与推断又混在一起。","事实示例：「脉沉细」「口渴不欲饮」「服三剂而利止」（可在原文定位、无解释词）；推断示例：「此少阴寒化」「当温补肾阳」「附子走而不守故效」（解释性语言，或出自后按）。判断依据写在同一行右侧：可逐字定位 / 属解释或后按。"],"qz":[["一份完整医案通常不包括",["患者职业与收入","主诉与现病史","舌象脉象","治法与方药"],0,"医案要素为时间、姓名、主诉、病史、舌脉、诊断、治法、方药、转归；职业收入非必需。","教材医案书写规范"],["读医案时区分「事实」与「推断」的意义在于",["避免把后人解释当成原文证据","便于背诵","加快阅读速度","减少字数"],0,"区分二者才能判断哪些是原始观察、哪些是解释框架，避免循环论证。","中医文献学常识"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":90,"date":"2027-02-11","type":"lesson","stage":6,"sn":"临证 · 医案与复盘","t":"叶天士医案","m":"《临证指南医案》选一案（可用 skills/ye-tianshi 语料对照）","a":"《温热论》卫气营血框架回看","f":["先自己辨证，再对照医家思路：你漏掉了哪条线索？","叶案常不写明确方名，这对读案提出了什么要求？"],"fa":["最常漏四条：①「口渴不欲饮」「舌腻」提示湿或阴伤层次，不是单纯里热；②痛有定处、夜间加剧、久病入络的线索；③「形瘦色苍」「素禀木火」等体质描述，直接决定能否用温燥；④前医所用何药而无效，是极强的负性证据。叶案字极简，须把每字都当证据用。","不写方名，就不能「按病名套方」，必须从药味反推治法与病机：见轻清宣透之品即知邪在肺卫，见甘寒养胃即知津伤，见咸寒介类即知肝肾阴亏、虚风内动。这要求读者熟药性与配伍，把「方」还原成「法」，再回头检验自己的辨证链是否自洽。"],"w":[["医案卡","选一案，先写自己的辨证，再写叶氏思路，最后标出差异"],["对比卡","叶氏用药「轻灵」与经方「峻猛」：各自适用什么病势"]],"wa":["三段式：①我的辨证——逐条列证据 → 定病位 → 定病性 → 立法 → 拟方；②叶氏思路——仅据药味逆推其立法与病机；③差异——具体写出漏掉哪一条线索、因何导致立法不同。差异栏禁止写「经验不足」，必须指向可指认的证据。","叶氏轻灵：药味少、剂量轻、多用轻清宣透与甘寒养阴，适合上焦卫气分、病势轻浅、体虚或久病宜缓图者；经方峻猛：药专力宏、剂量较大，麻桂附姜直取其病，适合表里实证、邪盛而正气未衰、病势急重者。取舍看邪正盛衰与病位深浅，不是门户之见。"],"qz":[["《临证指南医案》由谁整理成书",["华岫云等门人","叶天士本人","吴鞠通","薛生白"],0,"叶氏医案由门人华岫云等整理编次而成，非叶氏手定。","《临证指南医案》"],["叶天士在温病学上的主要贡献是",["创立卫气营血辨证","创立三焦辨证","著《温疫论》","著《湿热病篇》"],0,"叶天士创卫气营血辨证；三焦辨证为吴鞠通所创。","《温热论》"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":91,"date":"2027-02-12","type":"lesson","stage":6,"sn":"临证 · 医案与复盘","t":"经方医案","m":"选读一则经方医案（桂枝汤类或柴胡类），对照《伤寒论》原条文","a":"《经方实验录》选案（如可得）","f":["这案的方证对应，是抓主症还是抓病机？","若原条文与本案症状不完全吻合，作者凭什么用此方？"],"fa":["以主症为入口、以病机为校验，二者缺一不可。典型案（如往来寒热、胸胁苦满、嘿嘿不欲饮食、心烦喜呕）直接抓主症组合即可定方；症状不典型而仍用该方时，抓的是病机（枢机不利、正邪分争）。只读主症易套方，只读病机易游移无据。","凭「病机相同 + 一二者主症可征 + 已排除禁忌」，即「但见一证便是，不必悉具」；再参合兼证、体质、既往误治史与服药后反应。作者通常在按语里补出这条推理链，读案时要把它单独摘出来检验：若把本案主症换成另一组，结论还成立吗？"],"w":[["医案卡","写「条文—本案—差异」三列对照表"],["对比卡","方证对应与辨证论治：两种表述的侧重点"]],"wa":["三列：条文列（原书主症、或然证、禁忌，标条文号）／本案列（实际见症、舌脉、前药）／差异列（缺哪几症、多哪几症、为何仍可用——必须落到病机层面的解释）。表下补一句「本案取舍的关键证据」。","「方证对应」强调可重复的症候群与方之间的直接映射，重在「验」、便于初学入手与重复验证；「辨证论治」强调由病因、病位、病性推到立法再选方，重在「理」、便于处理不典型与复杂证。一个侧重「象」，一个侧重「机」，临床互为校验而非互斥。"],"qz":[["「方证对应」的核心是",["方剂的适应证与患者现症高度吻合","方名与病名相同","药味越多越好","剂量越大越好"],0,"方证对应强调方与证的对应关系，以现症群为用方依据。","《伤寒论》"],["经方医案的学习价值主要在于",["展示条文在具体病例中的适用边界","提供固定套路","替代理论学习","证明某方万能"],0,"医案显示条文的适用条件与变通，帮助理解方证边界。","中医医案学常识"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":92,"date":"2027-02-13","type":"review","stage":6,"t":"学情检查 · 第 23 次","from":[89,90,91],"qs":[["一份完整医案通常不包括",["患者职业与收入","主诉与现病史","舌象脉象","治法与方药"],0,"医案要素为时间、姓名、主诉、病史、舌脉、诊断、治法、方药、转归；职业收入非必需。","教材医案书写规范"],["《临证指南医案》由谁整理成书",["华岫云等门人","叶天士本人","吴鞠通","薛生白"],0,"叶氏医案由门人华岫云等整理编次而成，非叶氏手定。","《临证指南医案》"],["叶天士在温病学上的主要贡献是",["创立卫气营血辨证","创立三焦辨证","著《温疫论》","著《湿热病篇》"],0,"叶天士创卫气营血辨证；三焦辨证为吴鞠通所创。","《温热论》"],["「方证对应」的核心是",["方剂的适应证与患者现症高度吻合","方名与病名相同","药味越多越好","剂量越大越好"],0,"方证对应强调方与证的对应关系，以现症群为用方依据。","《伤寒论》"],["经方医案的学习价值主要在于",["展示条文在具体病例中的适用边界","提供固定套路","替代理论学习","证明某方万能"],0,"医案显示条文的适用条件与变通，帮助理解方证边界。","中医医案学常识"]],"an":{"quiz":"学情检查 5 题均为单选，答案见 questions[].a，解析见 why，出处见 src。","note":"错题按 src/why 回看对应学习日的精读与参考答案，再进入新内容。"},"dur":20,"box":[["5 道学情检查（选完出解析）",10],["错题回看前 3 天",10]]},{"d":93,"date":"2027-02-14","type":"lesson","stage":6,"sn":"临证 · 医案与复盘","t":"针灸 · 经络与取穴","m":"library/针灸甲乙经.txt 选读；教材经络腧穴章：骨度分寸、体表标志","a":"《针灸大成》卷一部分；十四经循行","f":["循经取穴与局部取穴，各自的判断前提是什么？","骨度分寸为什么必须结合体表标志使用？"],"fa":["循经取穴的前提是「病位可归属某经或该经所过、所主」，故须先辨经：前额痛属阳明、两侧痛属少阳、后头项强属太阳。局部取穴的前提是「局部有可指认的病所」——压痛、肿胀、结节、活动受限，不必依赖辨经即可取，故常用于经属不明或局部症状突出时，二者常配用。","骨度分寸是比例折算，高矮胖瘦、肢体长短差异很大，纯按寸数必然偏移；须先以固定体表标志（骨突、肌腱、皮纹、脐、五官、发际）为锚点，再按骨度折算。活动标志（张口取听宫、屈肘取曲池、握拳取后溪）还必须在特定体位下才准，故「分寸 + 标志 + 体位」三者不可分。"],"w":[["概念卡","写「循经取穴／局部取穴／对症取穴」三类各两条例子"],["对比卡","同经取穴与表里经取穴：什么时候选后者"]],"wa":["循经取穴：后项强痛取后溪（太阳经所过）、牙痛取合谷（手阳明经）；局部取穴：膝痛取犊鼻与内膝眼、胃脘痛取中脘；对症取穴：发热取大椎、呕吐取内关。每例后注明归类依据，并提醒内关既是对症亦属循经（手厥阴络穴），归类可重叠但须写明理由。","同经取穴取本经四肢远端穴，治本经循行部位与所属脏腑之病，如肺经咳喘取列缺；表里经取穴取相表里之经的穴位，用于本经病兼见表里经证、或本经久病需从表里经调，如肺病兼大肠腑实取合谷、曲池。选择看有无表里经兼证与是否需要「从阳引阴、从阴引阳」。"],"qz":[["「肚腹三里留，腰背委中求，头项寻列缺，面口合谷收」出自",["四总穴歌","八会穴歌","十四经发挥","标幽赋"],0,"此为四总穴歌，概括四个常用要穴的主治范围。","针灸歌赋"],["循经取穴的主要依据是",["经脉所过，主治所及","穴位编号顺序","左右对称","穴位面积大小"],0,"循经取穴依据经脉循行与病位的对应关系，即「经脉所过，主治所及」。","《针灸学》治疗总论"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":94,"date":"2027-02-15","type":"lesson","stage":6,"sn":"临证 · 医案与复盘","t":"针灸 · 特定穴","m":"教材特定穴章：五输穴（井荥输经合）、原穴、络穴、郄穴、募穴、背俞穴","a":"《难经·六十八难》五输穴主治；《针灸大成》特定穴歌","f":["为什么五输穴要用五行属性来配？","募穴与背俞穴，一在前一在后，反映的是同一件事吗？"],"fa":["井荥输经合本义是经气「所出为井、所溜为荥、所注为输、所行为经、所入为合」，描述由小到大、由浅入深的流注；再配五行（阴经井木起、阳经井金起），便可套用五行生克推出「虚则补其母、实则泻其子」，使选穴与方药共用一套辨证逻辑，而不只是经验穴位的堆积。","同指脏腑之气输注结聚之处，但部位与侧重不同：募穴在胸腹属阴，为脏腑之气结聚于前，偏治腑病、新病、急性与局部证；背俞穴在背腰属阳，为脏腑之气输注于后，偏治脏病、久病、虚损。前后同取即「俞募配穴」，一阴一阳相引，常用于脏腑同病。"],"w":[["概念卡","画五输穴—五行对应表，各写一条主治规律"],["对比卡","原穴与络穴：一治本经一治表里，如何配用"]],"wa":["五行对应：阴经 井木、荥火、输土、经金、合水；阳经 井金、荥水、输木、经火、合土。主治规律据《难经·六十八难》：井主心下满、荥主身热、输主体重节痛、经主喘咳寒热、合主逆气而泄。表下写两条应用：肺虚补其母（土）取太渊，肺实泻其子（水）取尺泽。","原穴是脏腑原气经过留止之处，重在治本经本脏虚实，如肺虚久咳取太渊；络穴联络表里两经，重在治表里两经同病，如列缺通手阳明大肠经。配用次序：先取病经原穴固本，兼见表里经证再加相表里之经的络穴，即「原络配穴（主客配穴）」，先主后客。"],"qz":[["五输穴不包括",["原穴","井穴","荥穴","合穴"],0,"五输穴为井、荥、输、经、合；原穴属另一类特定穴。","《针灸学》特定穴"],["背俞穴位于",["背腰部足太阳膀胱经第一侧线","胸腹部","四肢末端","头面部"],0,"背俞穴为脏腑之气输注于背部的腧穴，位于膀胱经第一侧线。","《针灸学》特定穴"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":95,"date":"2027-02-16","type":"lesson","stage":6,"sn":"临证 · 医案与复盘","t":"复盘第一张卡","m":"重读你在第 1 天写的概念卡；回看 96 天里所有卡片","a":"全部条文卡与医案卡","f":["哪些当时写对了，哪些现在能自己纠正？为什么当时会错？","如果只保留十张卡，你留哪十张？依据是什么？"],"fa":["写对的通常是原文引文与出处标注；现在能自己纠正的多是：把「阴阳」当实体而非关系模型、把「消长」与「转化」混为一谈、举例时用日常语言说反（如把「寒极生热」当成寒证会自动转成热证）。当时会错，是因为只有一条定义、没有反例，也没有把它放进病机语境里用过。","依据是四条：可迁移性（是否在此后各阶段反复用到）、有无原文出处、是否自带反例与边界、能否支撑后续辨证。建议十张：阴阳四组关系、五行生克乘侮、藏象核心、四诊要点、八纲、气血津液、四气五味、君臣佐使、六经提纲、卫气营血。其余按出处可回查，不必强留。"],"w":[["概念卡","重写第 1 天那张卡，并附一段「修订说明」"],["对比卡","旧版与新版并列，标出认知改变的关键一步"]],"wa":["新卡须含五件：一句准确定义、四组关系各配正反例、出处（《素问·阴阳应象大论》）、一条具体情境中的用法、一条「旧版错在哪」。修订说明写三段：改了什么 → 为什么改 → 依据哪条原文或哪一天的学习；末尾标日期，便于三五年后再回看认知变化。","旧版并列：照抄教材的定义 / 生活类比 / 无出处 / 无边界；新版：关系模型 + 反例 + 出处 + 适用边界 + 一条可检验的用法。认知改变的关键一步是「从记住一个词，变成能用它判断一个具体情境」——即引入可证伪的反例，并用出处约束住自己的发挥。"],"qz":[["复盘旧笔记时最有价值的动作是",["找出当时判断错误的环节并说明原因","重新抄写一遍","只看正确答案","删掉旧笔记"],0,"复盘的目的是定位认知偏差的形成机制，而非重复记忆。","学习方法常识"],["间隔重复对长期记忆的作用主要来自",["在遗忘临界点主动提取","增加阅读次数","延长学习时间","抄写速度"],0,"主动提取比被动重读更有效，间隔安排可强化长期保持。","认知心理学常识"]],"dur":20,"box":[["精读",8],["泛读（建立联系）",4],["带着问题读（思考 + 看参考答案）",3],["今天写两张卡（写 + 对照要点）",3],["随堂自测 2 题（选完出解析）",2]]},{"d":96,"date":"2027-02-17","type":"review","stage":6,"t":"学情检查 · 第 24 次","from":[93,94,95],"qs":[["「肚腹三里留，腰 function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function yesterday(){const d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object')return Object.assign({done:{},checks:{},cards:[],deleted:{},doneDays:{},exams:[],streak:0,lastCheck:'',readIdx:0},s)}catch(e){}return {done:{},checks:{},cards:[],deleted:{},doneDays:{},exams:[],streak:0,lastCheck:'',readIdx:0}}
let state=load();
function save(skipSync){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('本地存储写入失败，建议导出备份')}if(!skipSync)markDirty()}

let syncMeta={status:'idle',msg:'',at:'',sha:null,busy:false,timer:null};
function nowStr(){const d=new Date();return d.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function setSync(patch){syncMeta=Object.assign(syncMeta,patch);renderSyncMeta()}
function syncStatusHtml(){
  const map={idle:['b-gray','未启用'],ok:['b-green','已同步'],busy:['b-blue','同步中'],dirty:['b-amber','待同步'],error:['b-red','同步失败']};
  const it=map[syncMeta.status]||map.idle;
  return '<span class="badge '+it[0]+'">'+it[1]+'</span>'+(syncMeta.at?' <span class="muted" style="font-size:12px">'+esc(syncMeta.at)+'</span>':'')+(syncMeta.msg?' <span class="muted" style="font-size:12px">'+esc(syncMeta.msg)+'</span>':'');
}
function renderSyncMeta(){const el=document.getElementById('syncstatus');if(el)el.innerHTML=syncStatusHtml();const b=document.getElementById('syncbadge');if(b)b.innerHTML=syncStatusHtml()}
async function ghApi(method,path,body){
  const r=await fetch('https://api.github.com'+path,{method:method,headers:{'Authorization':'Bearer '+syncCfg.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const data=await r.json().catch(()=>({}));
  if(r.status===404)return {ok:false,status:404,data:data};
  if(!r.ok)throw new Error((data&&data.message)||('HTTP '+r.status));
  return {ok:true,data:data};
}
function mergeStates(local,remote){
  const out=Object.assign({},remote);
  out.deleted=Object.assign({},remote.deleted||{},local.deleted||{});
  const map=new Map();
  (remote.cards||[]).forEach(c=>map.set(c.id,c));
  (local.cards||[]).forEach(c=>{
    const r=map.get(c.id);
    if(!r||(c.updatedAt||c.created||'')>=(r.updatedAt||r.created||''))map.set(c.id,c);
  });
  out.cards=Array.from(map.values()).filter(c=>{
    const t=out.deleted[c.id];
    return !t||(c.updatedAt||0)>t;
  });
  out.done=Object.assign({},remote.done||{});
  Object.keys(local.done||{}).forEach(k=>{if(local.done[k])out.done[k]=true});
  out.checks=Object.assign({},remote.checks||{});
  Object.keys(local.checks||{}).forEach(k=>{
    const a=out.checks[k]||[false,false,false],b=local.checks[k]||[];
    out.checks[k]=[0,1,2].map(i=>!!(a[i]||b[i]));
  });
  out.streak=Math.max(remote.streak||0,local.streak||0);
  out.lastCheck=[remote.lastCheck||'',local.lastCheck||''].sort().pop();
  out.readIdx=(local.readIdx||0);
  return out;
}
async function syncPull(silent){
  if(!syncCfg)return;
  setSync({status:'busy',msg:'读取云端…'});
  try{
    const res=await ghApi('GET','/repos/'+syncCfg.owner+'/'+syncCfg.repo+'/contents/'+syncCfg.path);
    if(!res.ok){setSync({status:'ok',msg:'云端尚无数据，首次保存时创建',at:nowStr(),sha:null});return}
    const raw=res.data.content.replace(/\s/g,'');
    const remote=JSON.parse(new TextDecoder().decode(b64ToBin(raw)));
    const before=state.cards.length;
    state=mergeStates(state,remote);
    save(true);
    setSync({status:'ok',msg:'已合并云端数据（本地 '+before+' → '+state.cards.length+' 张）',at:nowStr(),sha:res.data.sha});
    renderAll();
  }catch(e){setSync({status:'error',msg:'拉取失败：'+e.message})}
}
async function syncPush(){
  if(!syncCfg||syncMeta.busy)return;
  syncMeta.timer=null;syncMeta.busy=true;setSync({status:'busy',msg:'写入云端…'});
  try{
    const body={message:'notes: '+new Date().toLocaleString('zh-CN'),content:binToB64(new TextEncoder().encode(JSON.stringify(state)))};
    if(syncMeta.sha)body.sha=syncMeta.sha;
    let res=await ghApi('PUT','/repos/'+syncCfg.owner+'/'+syncCfg.repo+'/contents/'+syncCfg.path,body);
    if(!res.ok)throw new Error('路径不存在或无权限（HTTP 404）');
    syncMeta.sha=res.data.content.sha;
    setSync({status:'ok',msg:'已提交 '+state.cards.length+' 张卡片',at:nowStr()});
  }catch(e){
    const msg=String(e.message||e);
    if(/409|sha|conflict/i.test(msg)){
      try{
        const g=await ghApi('GET','/repos/'+syncCfg.owner+'/'+syncCfg.repo+'/contents/'+syncCfg.path);
        if(g.ok){
          state=mergeStates(state,JSON.parse(new TextDecoder().decode(b64ToBin(g.data.content.replace(/\s/g,'')))));
          save(true);syncMeta.sha=g.data.sha;
          const body={message:'notes: merge '+new Date().toLocaleString('zh-CN'),content:binToB64(new TextEncoder().encode(JSON.stringify(state))),sha:syncMeta.sha};
          const r2=await ghApi('PUT','/repos/'+syncCfg.owner+'/'+syncCfg.repo+'/contents/'+syncCfg.path,body);
          if(r2.ok){syncMeta.sha=r2.data.content.sha;setSync({status:'ok',msg:'冲突已合并',at:nowStr()});syncMeta.busy=false;return}
        }
      }catch(e2){}
    }
    setSync({status:'error',msg:'写入失败：'+msg});
  }
  syncMeta.busy=false;
}
function markDirty(){
  if(!syncCfg)return;
  clearTimeout(syncMeta.timer);
  setSync({status:'dirty',msg:'6 秒后自动提交'});
  syncMeta.timer=setTimeout(syncPush,6000);
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>toast('已复制')).catch(()=>fallback(t));return}
  fallback(t);
  function fallback(x){const a=document.createElement('textarea');a.value=x;a.style.position='absolute';a.style.left='-9999px';document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('已复制')}catch(e){alert('请手动复制：\n'+x)}document.body.removeChild(a)}
}
function toast(msg){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='position:absolute;right:24px;bottom:24px;background:#2E2B26;color:#fff;padding:9px 16px;border-radius:7px;font-size:13px;z-index:99';document.body.appendChild(e)}e.textContent=msg;clearTimeout(e._t);e._t=setTimeout(()=>e.remove(),1600)}
function currentStage(){const i=STAGES.findIndex(s=>!state.done[s.id]);return i<0?STAGES[STAGES.length-1].name.split(' · ')[0]:STAGES[i].name.split(' · ')[0]}
function markDayDone(d,date){
  state.doneDays[d]=new Date().toISOString();
  const t=today();
  if(date===t&&state.lastCheck!==t){
    state.streak=(state.lastCheck===yesterday()?state.streak:0)+1;
    state.lastCheck=t;
  }
}
function unmarkDayDone(d,date){
  delete state.doneDays[d];
  const t=today();
  if(date===t&&state.lastCheck===t){state.streak=Math.max(0,(state.streak||0)-1);state.lastCheck=''}
}
function renderMeta(){

}

let viewDay=null;
function planToday(){const t=today();return PLAN.find(x=>x.date===t)||null}
function courseItem(){if(viewDay)return PLAN.find(x=>x.d===viewDay)||PLAN[0];return planToday()||PLAN[0]}
function examVerdict(e){
  if(!e)return null;
  if(e.level==='pass')return ['b-green','通过 · 继续推进','答对 '+e.correct+'/'+e.total+'（'+e.score+' 分）。前三天的框架立住了，按计划往下走。'];
  if(e.level==='gap')return ['b-amber','有缺口 · 建议回看','答对 '+e.correct+'/'+e.total+'（'+e.score+' 分）。把错题对应的那一天重读一遍，再进入新内容。'];
  return ['b-red','需要回补 · 暂不推进','答对 '+e.correct+'/'+e.total+'（'+e.score+' 分）。把覆盖的三个学习日重做，卡片重写一张。'];
}
function qHtml(q,i,key,revealed){
  const ans=(window._ans||{})[key];
  const correct=q[2];
  const opts=q[1].map((o,j)=>{
    let st='margin:3px 8px 3px 0;';
    if(revealed&&j===correct)st+='border-color:#4A6B57;background:#EDF4EF;color:#35503F;';
    else if(revealed&&ans===j&&j!==correct)st+='border-color:#A6433A;background:#FBF0ED;color:#A6433A;';
    else if(!revealed&&ans===j)st+='border-color:#A6433A;background:#FBF0ED;';
    return '<button class="btn sm" data-qopt="'+key+':'+j+'" style="'+st+'">'+'ABCD'[j]+'. '+esc(o)+'</button>';
  }).join('');
  let fb='';
  if(revealed){
    const ok=ans===correct;
    fb='<p style="margin:8px 0 0;font-size:13px;'+(ok?'color:#35503F':'color:#A6433A')+'">'+(ok?'正确':'正确答案 '+'ABCD'[correct])+'　'+esc(q[3])+'　<span style="color:var(--ink3)">（'+esc(q[4])+'）</span></p>';
  }else{
    fb='<details class="ansbox"><summary>查看答案与解析</summary><p><b>答案 '+'ABCD'[correct]+'</b>　'+esc(q[3])+'　<span style="color:var(--ink3)">（'+esc(q[4])+'）</span></p></details>';
  }
  return '<div class="quiz" style="margin-bottom:10px"><p style="margin:0 0 8px"><b>'+(i+1)+'.</b> '+esc(q[0])+'</p><div>'+opts+'</div>'+fb+'</div>';
}
function boxHtml(p){

    +box.map(x=>'<span>'+esc(x[0])+' <b>'+x[1]+'′</b></span>').join('')+'</div>';
}
function ansDetails(label,text){
  return '<details class="ansbox"><summary>'+esc(label)+'</summary><p>'+esc(text||'')+'</p></details>';
}

function binToB64(u8){let s='';const CH=0x8000;for(let i=0;i<u8.length;i+=CH){s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH))}return btoa(s)}
function b64ToBin(b){const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
async function makeSyncCode(){
  const bytes=new TextEncoder().encode(JSON.stringify(state));
  if(typeof CompressionStream!=='undefined'){
    try{
      const gz=await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))).blob();
      return 'TCM2:'+binToB64(new Uint8Array(await gz.arrayBuffer()));
    }catch(e){}
  }
  return 'TCM1:'+binToB64(bytes);
}
async function readSyncCode(code){
  code=(code||'').trim();
  if(code.startsWith('TCM2:')){
    const u=b64ToBin(code.slice(5));
    const txt=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return JSON.parse(txt);
  }
  if(code.startsWith('TCM1:')){return JSON.parse(new TextDecoder().decode(b64ToBin(code.slice(5))))}
  throw new Error('这不是本工作台生成的同步码');
}

function exportMarkdown(){
  if(!state.cards.length){alert('还没有卡片');return}
  const by={};state.cards.forEach(c=>{(by[c.type]=by[c.type]||[]).push(c)});
  let md='# 中医学习笔记\n\n导出时间：'+today()+'　共 '+state.cards.length+' 张卡片\n\n';
  CARD_TYPES.forEach(t=>{
    if(!by[t])return;
    md+='## '+t+'\n\n';
    by[t].forEach(c=>{
      md+='### '+c.title+'\n\n'+c.body+'\n\n';
      if(c.source)md+='- 出处：'+c.source+'\n';
      if((c.tags||[]).length)md+='- 标签：'+c.tags.join('、')+'\n';
      md+='- 建立：'+(c.created||'')+'　更新：'+(c.updatedAt||'').slice(0,10)+'\n\n';
    });
  });
  const blob=new Blob([md],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='中医学习笔记-'+today()+'.md';a.click();
  URL.revokeObjectURL(a.href);toast('已导出 Markdown');
}

  ${PROMPTS.map(g=>`<div class="card" style="margin-bottom:14px"><h3>${esc(g.c)}</h3>${g.list.map(p=>`
    <div class="prompt"><p>${esc(p.p)}</p><button class="btn sm" data-copy="${esc(p.p)}">复制</button> <span class="muted" style="font-size:12px">${esc(p.t)}</span></div>`).join('')}</div>`).join('')}`;
}

function renderAll(){renderOverview();renderCourse();renderPath();renderResources();renderLibrary();renderSkills();renderCards();renderSync();renderPrompts()}

document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));
  document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id==='p-'+b.dataset.p));
});

document.addEventListener('input',e=>{
  if(e.target.id==='resq'){resQuery=e.target.value;renderResources();const el=document.getElementById('resq');el.focus();el.setSelectionRange(el.value.length,el.value.length)}
  if(e.target.id==='cardq'){window._cardQuery=e.target.value;const pos=e.target.selectionStart;renderCards();const el=document.getElementById('cardq');el.focus();el.setSelectionRange(pos,pos)}
  if(e.target.id==='libq'){libQuery=e.target.value;const pos=e.target.selectionStart;renderLibrary();const el=document.getElementById('libq');el.focus();el.setSelectionRange(pos,pos)}
});

document.addEventListener('click',e=>{
  const t=e.target;
  const cat=t.dataset.cat;if(cat){resFilter=cat;renderResources();return}
  const cf=t.dataset.cardfilter;if(cf){window._cardFilter=cf;renderCards();return}
  const lc=t.dataset.libcat;if(lc){libFilter=lc;renderLibrary();return}
  const gd=t.dataset.goday;if(gd){viewDay=+gd;renderCourse();document.getElementById('p-course').scrollIntoView({behavior:'smooth',block:'start'});return}
  const qo=t.dataset.qopt;
  if(qo){const parts=qo.split(':');window._ans=window._ans||{};window._ans[parts[0]+':'+parts[1]]=+parts[2];renderCourse();return}
  const cp=t.hasAttribute('data-copy');if(cp){copyText(t.getAttribute('data-copy'));return}
  const fin=t.dataset.finish;
  if(fin){state.done[fin]=!state.done[fin];save();renderPath();renderOverview();return}
  const tog=t.closest('[data-toggle]');
  if(tog){const s=tog.parentElement;s.classList.toggle('open');return}
  const del=t.dataset.del;
  if(del){if(confirm('删除这张卡片？')){state.deleted=state.deleted||{};state.deleted[del]=Date.now();state.cards=state.cards.filter(c=>c.id!==del);save();renderCards();renderOverview()}return}
  const ed=t.dataset.edit;
  if(ed){const c=state.cards.find(x=>x.id===ed);if(!c)return;
    window._editingId=ed;
    document.getElementById('c-type').value=c.type;document.getElementById('c-title').value=c.title;
    document.getElementById('c-source').value=c.source||'';document.getElementById('c-body').value=c.body;
    document.getElementById('c-tags').value=(c.tags||[]).join(',');
    document.getElementById('c-title').focus();toast('编辑中，改完点保存');return}
  const act=t.dataset.act;
  if(!act)return;
  if(act==='nextread'){state.readIdx=(state.readIdx+1)%READINGS.length;save();renderOverview()}
  if(act==='copyread'){const r=READINGS[state.readIdx%READINGS.length];copyText(r.q+'  ——'+r.s)}
  if(act==='gopath'){document.querySelector('[data-p="path"]').click()}
  if(act==='goskills'){document.querySelector('[data-p="skills"]').click()}
  if(act==='gocourse'){document.querySelector('[data-p="course"]').click()}
  if(act==='backtoday'){viewDay=null;renderCourse()}
  if(act==='donelesson'){
    const p=courseItem();markDayDone(p.d,p.date);
    save();renderCourse();renderOverview();toast('第 '+p.d+' 天已完成')}
  if(act==='undolesson'){const p=courseItem();unmarkDayDone(p.d,p.date);save();renderCourse();renderOverview()}
  if(act==='checkintoday'){
    const cp=planToday();if(!cp){toast('今天不在 96 天课程表内');return}
    markDayDone(cp.d,cp.date);save();renderOverview();renderCourse();toast('今日 20 分钟已打卡，连续 '+state.streak+' 天')}
  if(act==='undocheckin'){
    const cp=planToday();if(!cp)return;
    unmarkDayDone(cp.d,cp.date);save();renderOverview();renderCourse()}
  if(act==='coursecard'){
    const p=courseItem();document.querySelector('[data-p="cards"]').click();
    if(p.type==='lesson'){
      document.getElementById('c-type').value=(p.w&&p.w[0])?p.w[0][0]:'概念卡';
      document.getElementById('c-title').value=p.t;
      document.getElementById('c-source').value=p.m||'';
      document.getElementById('c-body').value='精读：'+(p.m||'')+'\n\n带着问题读：\n'+(p.f||[]).map(x=>'· '+x).join('\n');
      document.getElementById('c-title').focus();
    }}
  if(act==='submitexam'){
    const p=courseItem(),qs=p.qs||[],ans=window._ans||{};
    const keys=qs.map((_,i)=>p.d+':'+i);
    if(keys.some(k=>ans[k]===undefined)){alert('还有题没选');return}
    const correct=qs.filter((q,i)=>ans[keys[i]]===q[2]).length;
    const score=Math.round(correct/qs.length*10);
    const level=score>=8?'pass':(score>=5?'gap':'remedial');
    state.exams=state.exams||[];
    state.exams=state.exams.filter(e=>e.day!==p.d);
    state.exams.push({day:p.d,date:today(),score:score,correct:correct,total:qs.length,level:level,at:new Date().toISOString()});
    markDayDone(p.d,p.date);
    window._revealExam=window._revealExam||{};window._revealExam[p.d]=true;
    save();renderCourse();renderOverview();toast('答对 '+correct+'/'+qs.length+'，'+score+' 分');
  }
  if(act==='tocard'){const r=READINGS[state.readIdx%READINGS.length];document.querySelector('[data-p="cards"]').click();
    document.getElementById('c-title').value=r.s+'：我的理解';document.getElementById('c-source').value=r.s;
    document.getElementById('c-body').value='先写下自己的解释，再回原书核对。\n想一想：'+r.t;document.getElementById('c-title').focus()}
  if(act==='copycontract'){copyText(PROMPTS[PROMPTS.length-1].list[0].p)}
  if(act==='copyinstall'){copyText('BASE="$HOME/.workbuddy/skills"\nSRC="/Users/iptv/WorkBuddy/2026-11-13-13-44-58/tcm-workbench/skills"\nmkdir -p "$BASE"\nrsync -a "$SRC/中医/" "$BASE/中医/"\nrsync -a "$SRC/nihaisha/" "$BASE/nihaisha/"\nrsync -a "$SRC/ye-tianshi/" "$BASE/ye-tianshi/"')}
  if(act==='addcard'){
    const title=document.getElementById('c-title').value.trim();
    const body=document.getElementById('c-body').value.trim();
    if(!title||!body){alert('标题和正文都要写');return}
    const payload={type:document.getElementById('c-type').value,title:title,body:body,
      source:document.getElementById('c-source').value.trim(),
      tags:document.getElementById('c-tags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),
      updatedAt:new Date().toISOString()};
    if(window._editingId){
      const c=state.cards.find(x=>x.id===window._editingId);
      if(c)Object.assign(c,payload);
      window._editingId=null;
      toast('已更新');
    }else{
      state.cards.push(Object.assign({id:'c'+Date.now()+Math.random().toString(36).slice(2,6),created:today()},payload));
      toast('卡片已保存');
    }
    save();renderCards();renderOverview()}
  if(act==='export'){
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='中医学习工作台-备份-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('已导出')}
  if(act==='import'){document.getElementById('importfile').click()}
  if(act==='savecfg'){
    const repoV=document.getElementById('sync-repo').value.trim();
    const pathV=document.getElementById('sync-path').value.trim()||'state.json';
    const tokV=document.getElementById('sync-token').value.trim();
    const parts=repoV.split('/');
    if(parts.length!==2||!parts[0]||!parts[1]){alert('仓库格式应为 owner/repo，例如 zhshy/tcm-notes');return}
    const token=tokV||(syncCfg&&syncCfg.token)||'';
    if(!token){alert('请填写令牌');return}
    syncCfg={owner:parts[0],repo:parts[1],path:pathV,token:token};
    try{localStorage.setItem(SYNC_KEY,JSON.stringify(syncCfg))}catch(e){}
    syncMeta.sha=null;renderSync();syncPull();
  }
  if(act==='pullnow'){syncPull()}
  if(act==='pushnow'){syncPush()}
  if(act==='exportmd'){exportMarkdown()}
  if(act==='clearsync'){
    if(confirm('断开后本机数据保留，但不再自动同步。确定？')){
      syncCfg=null;try{localStorage.removeItem(SYNC_KEY)}catch(e){}
      syncMeta={status:'idle',msg:'',at:'',sha:null,busy:false,timer:null};renderSync();
    }
  }
  if(act==='gencode'){
    makeSyncCode().then(c=>{const el=document.getElementById('synccode');if(el){el.value=c;el.focus();el.select()}copyText(c)}).catch(()=>alert('生成失败，请改用「导出备份」'))}
  if(act==='usecode'){
    const el=document.getElementById('synccode');const code=el?el.value:'';
    readSyncCode(code).then(o=>{
      if(!o||!Array.isArray(o.cards))throw new Error('内容不完整');
      if(!confirm('导入会覆盖本机现有卡片与进度，确定继续？'))return;
      state=Object.assign({done:{},checks:{},cards:[],streak:0,lastCheck:'',readIdx:0},o);
      save();renderAll();toast('已导入 '+state.cards.length+' 张卡片');
    }).catch(err=>alert('导入失败：'+(err&&err.message?err.message:'无法解析')));
  }
});

document.addEventListener('change',e=>{
  if(e.target.id==='importfile'&&e.target.files[0]){
    const f=e.target.files[0];const rd=new FileReader();
    rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o.cards)throw 0;
      state=Object.assign({done:{},checks:{},cards:[],streak:0,lastCheck:'',readIdx:0},o);
      save();renderAll();toast('导入成功')}catch(err){alert('文件格式不对，请选择本工作台导出的 JSON')}};
    rd.readAsText(f)}
});

renderAll();
if(syncCfg){setTimeout(()=>syncPull(),900)}
</script>
</body>
